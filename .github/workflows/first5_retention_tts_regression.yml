name: First-5 Retention and TTS Regression

on:
  push:
    branches:
      - agent/first5-retention-tts-humanize

jobs:
  focused-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply production hotfix chain
        run: |
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          python ci_speech_style_hotfix.py
          python ci_hook_generation_hotfix.py
          python ci_hook_pool_guard_hotfix.py
          python ci_retention_hotfix.py
          python ci_first5_retention_tts_hotfix.py
          python ci_topic_input_hotfix.py

      - name: Compile focused retention paths
        run: |
          python -m py_compile \
            ci_first5_retention_tts_hotfix.py \
            content/script_generator.py \
            integrations/tts.py \
            video/hook_visual.py \
            video/video_engine.py \
            quality/first5_retention_tts_regression_test.py

      - name: Run first-five retention and TTS regression
        run: python quality/first5_retention_tts_regression_test.py

      - name: Run existing Hook regression
        run: python quality/hook_experiment_test.py

      - name: Run existing Retention regression
        run: python quality/retention_regression_test.py
