name: Shorts Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-cache -f -v

      - name: Verify Korean fonts
        run: |
          echo "=== Korean font check ==="

          fc-list :lang=ko family file | head -30

          if ! fc-list :lang=ko | grep -qi "Noto Sans CJK\|Nanum"; then
            echo "❌ Korean font not found"
            exit 1
          fi

          echo "✅ Korean font detected"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi

      - name: Apply V3.2.1.2 quality policy hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "MAX_TOPIC_REGENERATIONS = 1",
                  "MAX_TOPIC_REGENERATIONS = 2",
              ),
              (
                  "NOVELTY_HARD_REGENERATE_SCORE = 5.0",
                  "NOVELTY_HARD_REGENERATE_SCORE = 4.0",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"정책 패치 대상이 정확히 1개가 아닙니다: {old} (count={count})"
                  )
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          print("✅ Runtime policy hotfix applied")
          PY

          grep -n "MAX_TOPIC_REGENERATIONS\|NOVELTY_HARD_REGENERATE_SCORE" main.py
          python -m py_compile main.py

      - name: Run Shorts Generator V3.2
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ================================================
          # V3.2 Quality / Budget Guard
          # ================================================

          V3_JUDGE_MODEL: gpt-4o-mini

          # 세 번의 Candidate 시도 + Rewrite + 재심까지 감당할 호출 상한
          V3_MAX_API_CALLS: "30"

          # 한 번의 Shorts 실행당 추적 비용 상한
          V3_MAX_COST_USD: "0.05"

        run: |
          echo "========================================"
          echo "🚀 START SHORTS GENERATOR V3.2"
          echo "========================================"

          python main.py

          echo "========================================"
          echo "✅ SHORTS GENERATOR V3.2 FINISHED"
          echo "========================================"
