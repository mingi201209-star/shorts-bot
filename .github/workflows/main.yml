name: Shorts Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional fixed production topic (blank = automatic selection)"
        required: false
        default: ""
        type: string
      candidate_scope:
        description: "Optional automatic exploration scope (blank = default, aviation = aviation only)"
        required: false
        default: ""
        type: string
      youtube_upload:
        description: "Explicitly upload the rendered Short to YouTube"
        required: false
        default: false
        type: boolean
      youtube_privacy:
        description: "YouTube privacy when upload is explicitly enabled"
        required: false
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-cache -f -v

      - name: Verify Korean fonts
        run: |
          echo "=== Korean font check ==="
          fc-list :lang=ko family file | head -30
          if ! fc-list :lang=ko | grep -qi "Noto Sans CJK\|Nanum"; then
            echo "❌ Korean font not found"
            exit 1
          fi
          echo "✅ Korean font detected"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi

      - name: Apply production hotfixes
        run: |
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          python ci_speech_style_hotfix.py
          python ci_hook_generation_hotfix.py
          python ci_hook_pool_guard_hotfix.py
          python ci_retention_hotfix.py
          python ci_first5_retention_tts_hotfix.py
          python ci_first5_visual_contract_hotfix.py
          python ci_video_provider_hotfix.py
          python ci_topic_input_hotfix.py
          python ci_aviation_candidate_context_hotfix.py
          python ci_aviation_candidate_specificity_hotfix.py
          python ci_aviation_context_signature_compat_hotfix.py
          python ci_aviation_specificity_output_repair_hotfix.py
          python ci_aviation_specificity_projection_hotfix.py
          python ci_candidate_grounded_recovery_hotfix.py
          python ci_growth_candidate_shadow_hotfix.py
          python ci_final_render_content_integrity_hotfix.py
          python ci_output_quality_hotfix.py
          python ci_curiosity_retention_hotfix.py
          python ci_visual_specificity_hotfix.py
          python ci_design_causality_hotfix.py
          python ci_query_semantic_integrity_hotfix.py
          python ci_concrete_visual_evidence_hotfix.py
          python ci_visible_evidence_provenance_hotfix.py
          python ci_hook_production_parity_hotfix.py
          python ci_hook_fallback_quality_floor_hotfix.py
          python ci_ai_visual_fallback_hotfix.py
          python ci_ai_visual_mechanism_fallback_hotfix.py
          python ci_problem_solution_narrative_hotfix.py
          python ci_causal_information_progression_hotfix.py
          python ci_retention_structure_experiment_hotfix.py
          python ci_subscriber_conversion_hotfix.py
          python ci_script_production_parity_hotfix.py
          python ci_script_production_parity_bridge_hotfix.py
          python ci_adaptive_scene_count_hotfix.py
          python ci_general_scene_visual_parity_hotfix.py
          python ci_script_validation_recovery_hotfix.py
          python ci_script_v2_visual_goal_hotfix.py
          python ci_final_visual_semantic_qa_hotfix.py

          # Some later production hotfixes rewrite candidate_explorer wrappers.
          # Re-apply the compatibility patch against the FINAL production state.
          python ci_aviation_context_signature_compat_hotfix.py

          grep -n "MAX_TOPIC_REGENERATIONS\|NOVELTY_HARD_REGENERATE_SCORE" main.py
          grep -n "Novelty 조기 차단" main.py
          grep -n "FACT_CRITICAL CANDIDATE REGENERATION" main.py
          grep -n "CANDIDATE_GROUNDED_RECOVERY_V1\|CANDIDATE_RECOVERY_POOL\|CANDIDATE GROUNDED RECOVERY" main.py
          grep -n "GROWTH_CANDIDATE_SHADOW_V1\|Growth Shadow (non-authoritative)" main.py
          grep -n "MAX_SCRIPT_ATTEMPTS" config.py
          grep -n '"+13%"' config.py
          grep -n "AVIATION_SPECIFICITY_OUTPUT_REPAIR_V1\|AVIATION_SPECIFICITY_PROJECTION_V3" content/candidate_explorer.py
          grep -n "FINAL_RENDER_CONTENT_INTEGRITY_V1\|CONTENT_IDENTITY_DRIFT" main.py
          grep -n "PROBLEM → SOLUTION NARRATIVE — EVIDENCE GATED\|ADAPTIVE_SCENE_COUNT_FOR_DENSE_DESIGN_V1\|ADAPTIVE_DESIGN_MIN_SCENES\|SCRIPT_VALIDATION_RECOVERY_V1\|RETENTION_STRUCTURE_EXPERIMENT_V1\|FIRST 5 SEC MINI NARRATIVE\|SUBSCRIBER_CONVERSION_LAYER_V1\|Subscriber conversion" content/script_generator.py
          grep -n "subtitle_start=0.000s\|exact_tts_text=true" video/subtitle_engine.py
          grep -n "HOOK_SUBJECT_DOMINANCE_MIN\|HOOK_ACTION_MATCH_MIN\|HOOK_MAX_COMPETING_SUBJECT_RISK\|HOOK_SUBJECT_VISIBILITY_MIN" video/hook_visual_dominance.py
          grep -n "dominance_gate\|HOOK_DOMINANCE_MAX_CANDIDATES\|HOOK_CONCRETE_VISUAL_EVIDENCE\|DIRECT_VERIFIED\|UNVERIFIED_CONTEXTUAL_FALLBACK\|HOOK_FALLBACK_QUALITY_FLOOR\|AI_VISUAL_SORA_FALLBACK" video/hook_visual.py
          grep -n "VISUAL_TRACE\|VISUAL_CONTRACT" video/video_engine.py
          grep -n "search_video_candidates\|VIDEO_SELECTED\|VIDEO_PROVIDER\|CURRENT_NARRATION_SEMANTIC_MATCH\|VISUAL_SPECIFICITY\|QUERY_SEMANTIC_INTEGRITY\|CONCRETE_VISUAL_EVIDENCE_SAFE_REUSE\|VISIBLE_EVIDENCE_PROVENANCE_GATE\|AI_VISUAL_GENERAL_SELECTION_TRACE\|GENERAL_SCENE_VISUAL_PARITY_UNKNOWN_SAFE" video/video_downloader.py video/hook_visual.py

          python -m py_compile \
            ci_hotfix.py ci_novelty_budget_hotfix.py ci_fact_critical_hotfix.py ci_speech_style_hotfix.py \
            ci_hook_generation_hotfix.py ci_hook_pool_guard_hotfix.py ci_retention_hotfix.py \
            ci_first5_retention_tts_hotfix.py ci_first5_visual_contract_hotfix.py ci_video_provider_hotfix.py \
            ci_topic_input_hotfix.py ci_aviation_candidate_context_hotfix.py ci_aviation_candidate_specificity_hotfix.py \
            ci_aviation_context_signature_compat_hotfix.py ci_aviation_specificity_output_repair_hotfix.py \
            ci_aviation_specificity_projection_hotfix.py ci_candidate_grounded_recovery_hotfix.py \
            ci_growth_candidate_shadow_hotfix.py content/growth_candidate_ranker.py \
            ci_final_render_content_integrity_hotfix.py ci_output_quality_hotfix.py \
            ci_curiosity_retention_hotfix.py ci_visual_specificity_hotfix.py ci_design_causality_hotfix.py \
            ci_query_semantic_integrity_hotfix.py ci_concrete_visual_evidence_hotfix.py \
            ci_visible_evidence_provenance_hotfix.py ci_hook_production_parity_hotfix.py \
            ci_hook_fallback_quality_floor_hotfix.py ci_ai_visual_fallback_hotfix.py \
            ci_ai_visual_mechanism_fallback_hotfix.py ci_problem_solution_narrative_hotfix.py \
            ci_causal_information_progression_hotfix.py ci_retention_structure_experiment_hotfix.py \
            ci_subscriber_conversion_hotfix.py content/subscriber_conversion.py \
            ci_script_production_parity_hotfix.py ci_script_production_parity_bridge_hotfix.py \
            ci_adaptive_scene_count_hotfix.py ci_general_scene_visual_parity_hotfix.py \
            ci_script_validation_recovery_hotfix.py ci_script_v2_visual_goal_hotfix.py ci_final_visual_semantic_qa_hotfix.py content/retention_structure.py \
            quality/retention_structure_experiment_regression_test.py \
            quality/subscriber_conversion_regression_test.py \
            quality/fixed_topic_gate_feedback_regression_test.py \
            quality/candidate_grounded_recovery_regression_test.py \
            main.py config.py content/candidate_explorer.py content/candidate_recovery.py content/script_generator.py content/hook_experiment.py \
            integrations/tts.py quality/consensus.py quality/rewrite_engine.py quality/explanation_judge.py quality/korean_speech_style.py \
            quality/first5_visual_contract.py quality/final_render_integrity.py \
            quality/final_render_integrity_regression_test.py quality/final_visual_semantic_qa.py \
            quality/final_visual_semantic_qa_regression_test.py quality/aviation_specificity_projection_regression_test.py \
            video/video_providers.py video/hook_visual.py video/hook_visual_dominance.py video/video_downloader.py \
            video/video_engine.py video/subtitle_engine.py video/ai_visual_provider.py

          python quality/final_render_integrity_regression_test.py
          python quality/final_visual_semantic_qa_regression_test.py
          python quality/fixed_topic_gate_feedback_regression_test.py
          python quality/candidate_grounded_recovery_regression_test.py
          python -m quality.growth_candidate_shadow_regression_test
          python -m quality.retention_structure_experiment_regression_test
          python -m quality.subscriber_conversion_regression_test

      - name: Run Shorts Generator V3.2
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          V3_JUDGE_MODEL: gpt-4o-mini
          V3_MAX_API_CALLS: "60"
          V3_MAX_COST_USD: "0.05"
          ENABLE_HOOK_EXPERIMENT: "1"
          AI_VISUAL_FALLBACK_ENABLED: "false"
          AI_MAX_GENERATIONS_PER_VIDEO: "1"
          AI_VISUAL_MODEL: sora-2
          AI_VISUAL_SECONDS: "4"
          AI_VISUAL_SIZE: "720x1280"
          SHORTS_TOPIC: ${{ inputs.topic }}
          SHORTS_CANDIDATE_SCOPE: ${{ inputs.candidate_scope }}
        run: |
          echo "========================================"
          echo "🚀 START SHORTS GENERATOR V3.2"
          echo "========================================"
          python main.py
          echo "========================================"
          echo "✅ SHORTS GENERATOR V3.2 FINISHED"
          echo "========================================"

      - name: Preserve verified production artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-shorts-${{ github.run_id }}-${{ github.sha }}
          path: |
            final_shorts_*.mp4
            final_visual_semantic_qa.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish to YouTube and persist lineage
        env:
          ENABLE_YOUTUBE_UPLOAD: ${{ inputs.youtube_upload && '1' || '0' }}
          SHORTS_YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}
          SHORTS_YOUTUBE_TITLE: ${{ inputs.topic || 'Shorts' }}
          SHORTS_TOPIC: ${{ inputs.topic }}
          SHORTS_CANDIDATE_SCOPE: ${{ inputs.candidate_scope }}
          SHORTS_ANALYTICS_HISTORY_PATH: analytics/performance_history.json
          YOUTUBE_ANALYTICS_CLIENT_ID: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_ID }}
          YOUTUBE_ANALYTICS_CLIENT_SECRET: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
        run: python -m analytics.publish_and_persist

      - name: Preserve analytics history
        if: ${{ hashFiles('analytics/performance_history.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: analytics-history-${{ github.run_id }}
          path: analytics/performance_history.json
          retention-days: 90
