name: Shorts Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-cache -f -v

      - name: Verify Korean fonts
        run: |
          echo "=== Korean font check ==="

          fc-list :lang=ko family file | head -30

          if ! fc-list :lang=ko | grep -qi "Noto Sans CJK\|Nanum"; then
            echo "❌ Korean font not found"
            exit 1
          fi

          echo "✅ Korean font detected"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi

      - name: Run Shorts Generator V3.2
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ================================================
          # V3.2 Quality / Budget Guard
          # ================================================

          V3_JUDGE_MODEL: gpt-4o-mini

          # 한 번의 Shorts 실행에서
          # Generator + Judge + Rewrite 전체 API 호출 상한
          V3_MAX_API_CALLS: "12"

          # 한 번의 Shorts 실행당 추적 비용 상한
          V3_MAX_COST_USD: "0.05"

        run: |
          echo "========================================"
          echo "🚀 START SHORTS GENERATOR V3.2"
          echo "========================================"

          python main.py

          echo "========================================"
          echo "✅ SHORTS GENERATOR V3.2 FINISHED"
          echo "========================================"
