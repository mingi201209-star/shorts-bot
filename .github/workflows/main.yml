name: Shorts Automation Trigger

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-shorts]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check secrets
        run: |
          echo "Checking required secrets..."

          if [ -z "$OPENAI_KEY" ]; then
            echo "❌ OPENAI_KEY is EMPTY"
            exit 1
          else
            echo "✅ OPENAI_KEY detected"
          fi

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY is EMPTY"
            exit 1
          else
            echo "✅ PEXELS_API_KEY detected"
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN is EMPTY"
            exit 1
          else
            echo "✅ TELEGRAM_BOT_TOKEN detected"
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ TELEGRAM_CHAT_ID is EMPTY"
            exit 1
          else
            echo "✅ TELEGRAM_CHAT_ID detected"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Shorts Generator
        run: |
          python main.py
