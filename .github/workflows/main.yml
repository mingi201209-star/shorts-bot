name: Shorts Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-cache -f -v

      - name: Verify Korean fonts
        run: |
          echo "=== Korean font check ==="
          fc-list :lang=ko family file | head -30

          if ! fc-list :lang=ko | grep -qi "Noto Sans CJK\|Nanum"; then
            echo "❌ Korean font not found"
            exit 1
          fi

          echo "✅ Korean font detected"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi

      - name: Apply production hotfixes
        run: |
          python ci_hotfix.py

          grep -n "MAX_TOPIC_REGENERATIONS\|NOVELTY_HARD_REGENERATE_SCORE" main.py
          grep -n "MAX_SCRIPT_ATTEMPTS" config.py
          grep -n "temperature=0.5" content/candidate_explorer.py
          grep -n "GOOD_ENOUGH_SCORE\|\"hook\": 6.0" quality/consensus.py
          grep -n "NARRATION TONE\|존댓말 종결\|RETRY FEEDBACK\|meaningful_keyword_words" content/script_generator.py
          grep -n "모든 scene text는 자연스러운 한국어 존댓말" quality/rewrite_engine.py
          grep -n "Review 최대 횟수 초과\|SCRIPT GENERATION FAILED" main.py

          python -m py_compile \
            ci_hotfix.py \
            main.py \
            config.py \
            content/candidate_explorer.py \
            content/script_generator.py \
            quality/consensus.py \
            quality/rewrite_engine.py \
            video/video_downloader.py \
            video/video_engine.py

      - name: Run Shorts Generator V3.2
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          V3_JUDGE_MODEL: gpt-4o-mini
          V3_MAX_API_CALLS: "45"
          V3_MAX_COST_USD: "0.05"
        run: |
          echo "========================================"
          echo "🚀 START SHORTS GENERATOR V3.2"
          echo "========================================"

          python main.py

          echo "========================================"
          echo "✅ SHORTS GENERATOR V3.2 FINISHED"
          echo "========================================"
