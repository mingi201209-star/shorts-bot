name: Shorts Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-cache -f -v

      - name: Verify Korean fonts
        run: |
          echo "=== Korean font check ==="

          fc-list :lang=ko family file | head -30

          if ! fc-list :lang=ko | grep -qi "Noto Sans CJK\|Nanum"; then
            echo "❌ Korean font not found"
            exit 1
          fi

          echo "✅ Korean font detected"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi

      - name: Apply V3.2.1.2 production policy hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("main.py")
          main_source = main_path.read_text(encoding="utf-8")

          main_replacements = [
              (
                  "MAX_TOPIC_REGENERATIONS = 1",
                  "MAX_TOPIC_REGENERATIONS = 4",
              ),
              (
                  "NOVELTY_HARD_REGENERATE_SCORE = 5.0",
                  "NOVELTY_HARD_REGENERATE_SCORE = 4.0",
              ),
          ]

          for old, new in main_replacements:
              count = main_source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"main.py 패치 대상이 정확히 1개가 아닙니다: {old} (count={count})"
                  )
              main_source = main_source.replace(old, new, 1)

          main_path.write_text(main_source, encoding="utf-8")

          explorer_path = Path("content/candidate_explorer.py")
          explorer_source = explorer_path.read_text(encoding="utf-8")

          old_temp = "temperature=0.8,"
          new_temp = "temperature=0.5,"
          temp_count = explorer_source.count(old_temp)

          if temp_count != 1:
              raise RuntimeError(
                  "candidate_explorer.py temperature 패치 대상이 "
                  f"정확히 1개가 아닙니다: {old_temp} (count={temp_count})"
              )

          explorer_source = explorer_source.replace(
              old_temp,
              new_temp,
              1,
          )
          explorer_path.write_text(explorer_source, encoding="utf-8")

          consensus_path = Path("quality/consensus.py")
          consensus_source = consensus_path.read_text(encoding="utf-8")

          consensus_replacements = [
              (
                  "GOOD_ENOUGH_SCORE = 6.8",
                  "GOOD_ENOUGH_SCORE = 6.7",
              ),
              (
                  '    "hook": 7.0,',
                  '    "hook": 6.0,',
              ),
          ]

          for old, new in consensus_replacements:
              count = consensus_source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"consensus.py 패치 대상이 정확히 1개가 아닙니다: {old} (count={count})"
                  )
              consensus_source = consensus_source.replace(old, new, 1)

          consensus_path.write_text(consensus_source, encoding="utf-8")

          # ------------------------------------------------------------
          # Korean narration tone: 자연스러운 존댓말 강제
          # ------------------------------------------------------------
          script_path = Path("content/script_generator.py")
          script_source = script_path.read_text(encoding="utf-8")

          story_anchor = '''[STORY]
          Hook → Curiosity → Explanation → Reveal → Payoff의 흐름을 만든다.
          첫 장면부터 본론에 들어간다.
          "오늘은", "알아보겠습니다", "혹시 알고 계셨나요" 같은 도입은 금지한다.
          후반부는 단순 요약이 아니라 처음 질문을 실제 답으로 보상해야 한다.
          '''

          story_with_tone = '''[STORY]
          Hook → Curiosity → Explanation → Reveal → Payoff의 흐름을 만든다.
          첫 장면부터 본론에 들어간다.
          "오늘은", "알아보겠습니다", "혹시 알고 계셨나요" 같은 도입은 금지한다.
          후반부는 단순 요약이 아니라 처음 질문을 실제 답으로 보상해야 한다.

          [NARRATION TONE]
          모든 Scene의 text는 시청자에게 설명하는 자연스러운 한국어 존댓말로 쓴다.
          반말/해라체/문어체 종결인 "~다", "~이다", "~했다", "~한다"는 사용하지 않는다.
          "~습니다/~입니다"만 기계적으로 반복하지 말고
          "~는데요", "~죠", "~까요?", "~해요"를 문맥에 맞게 섞는다.
          과한 감탄, 호들갑, 억지 친근함은 피한다.
          짧고 또렷한 다큐멘터리 내레이션처럼 말한다.
          문장부호를 자연스럽게 사용해 TTS가 쉬어 읽을 지점을 만든다.
          '''

          story_count = script_source.count(story_anchor)
          if story_count != 1:
              raise RuntimeError(
                  "script_generator.py NARRATION TONE 패치 대상이 "
                  f"정확히 1개가 아닙니다. (count={story_count})"
              )
          script_source = script_source.replace(
              story_anchor,
              story_with_tone,
              1,
          )

          polite_anchor = '''        if not text:
              return False, f"{idx + 1}번 장면 대사가 없음"

          if len(visual_goal) < 8:
          '''

          polite_replacement = '''        if not text:
              return False, f"{idx + 1}번 장면 대사가 없음"

          polite_ending = text.rstrip(" .!?…~\\\"'”’")
          if not (
              polite_ending.endswith("요")
              or polite_ending.endswith("니다")
              or polite_ending.endswith("십시오")
          ):
              return False, (
                  f"{idx + 1}번 장면 대사가 존댓말 종결이 아님: {text}"
              )

          if len(visual_goal) < 8:
          '''

          polite_count = script_source.count(polite_anchor)
          if polite_count != 1:
              raise RuntimeError(
                  "script_generator.py 존댓말 검사 패치 대상이 "
                  f"정확히 1개가 아닙니다. (count={polite_count})"
              )
          script_source = script_source.replace(
              polite_anchor,
              polite_replacement,
              1,
          )

          script_path.write_text(script_source, encoding="utf-8")

          rewrite_path = Path("quality/rewrite_engine.py")
          rewrite_source = rewrite_path.read_text(encoding="utf-8")

          rewrite_anchor = '''- 기존 JSON 구조를 유지한다.
          - Candidate metadata를 재작성하지 않는다.

          수정된 전체 JSON 객체만 출력한다.
          '''

          rewrite_with_tone = '''- 기존 JSON 구조를 유지한다.
          - Candidate metadata를 재작성하지 않는다.
          - 모든 scene text는 자연스러운 한국어 존댓말을 유지한다.
          - 반말/해라체 종결인 "~다", "~이다", "~했다", "~한다"로 바꾸지 않는다.
          - "~습니다/~입니다"만 반복하지 말고 "~는데요", "~죠", "~까요?", "~해요"를 자연스럽게 섞는다.
          - 과한 유튜버식 감탄보다 차분하고 또렷한 다큐멘터리 내레이션을 우선한다.

          수정된 전체 JSON 객체만 출력한다.
          '''

          rewrite_count = rewrite_source.count(rewrite_anchor)
          if rewrite_count != 1:
              raise RuntimeError(
                  "rewrite_engine.py 존댓말 패치 대상이 "
                  f"정확히 1개가 아닙니다. (count={rewrite_count})"
              )
          rewrite_source = rewrite_source.replace(
              rewrite_anchor,
              rewrite_with_tone,
              1,
          )

          rewrite_path.write_text(rewrite_source, encoding="utf-8")

          print("✅ Runtime production + polite narration hotfix applied")
          PY

          grep -n "MAX_TOPIC_REGENERATIONS\|NOVELTY_HARD_REGENERATE_SCORE" main.py
          grep -n "temperature=0.5" content/candidate_explorer.py
          grep -n "GOOD_ENOUGH_SCORE\|\"hook\": 6.0" quality/consensus.py
          grep -n "NARRATION TONE\|존댓말 종결" content/script_generator.py
          grep -n "모든 scene text는 자연스러운 한국어 존댓말" quality/rewrite_engine.py
          grep -n "TTS_VOICE\|TTS_RATE" config.py
          python -m py_compile \
            main.py \
            config.py \
            content/candidate_explorer.py \
            content/script_generator.py \
            quality/consensus.py \
            quality/rewrite_engine.py

      - name: Run Shorts Generator V3.2
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ================================================
          # V3.2 Quality / Budget Guard
          # ================================================

          V3_JUDGE_MODEL: gpt-4o-mini

          # 최대 5번 Candidate 시도 + Rewrite + 재심까지 감당
          V3_MAX_API_CALLS: "30"

          # 한 번의 Shorts 실행당 추적 비용 상한
          V3_MAX_COST_USD: "0.05"

        run: |
          echo "========================================"
          echo "🚀 START SHORTS GENERATOR V3.2"
          echo "========================================"

          python main.py

          echo "========================================"
          echo "✅ SHORTS GENERATOR V3.2 FINISHED"
          echo "========================================"
