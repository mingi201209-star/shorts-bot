name: Shorts Auto Generator

on:
  workflow_dispatch: # 수동 실행 버튼
  schedule:
    - cron: '0 0 * * *' # 매일 정해진 시간에 자동 실행 (선택 사항)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 나눔폰트 및 미디어 처리를 위한 시스템 패키지 설치
    - name: Install System Dependencies & Korean Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-nanum

    # 필요한 파이썬 라이브러리 설치
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai edge-tts requests numpy pillow moviepy

    # main.py 실행 (Secrets에 등록한 API 키 적용)
    - name: Run Main Script
      env:
        OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
