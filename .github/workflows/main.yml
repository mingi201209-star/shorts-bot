name: Shorts Automation Trigger

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-shorts]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check API Keys
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "===== API KEY CHECK ====="

          if [ -n "$OPENAI_KEY" ]; then
            echo "OPENAI_KEY: OK"
          else
            echo "OPENAI_KEY: MISSING"
          fi

          if [ -n "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY: OK"
          else
            echo "PEXELS_API_KEY: MISSING"
          fi

          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN: OK"
          else
            echo "TELEGRAM_BOT_TOKEN: MISSING"
          fi

          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID: OK"
          else
            echo "TELEGRAM_CHAT_ID: MISSING"
          fi

      - name: Run Shorts Generator
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
