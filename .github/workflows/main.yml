name: Shorts Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-cache -f -v

      - name: Verify Korean fonts
        run: |
          echo "=== Korean font check ==="

          fc-list :lang=ko family file | head -30

          if ! fc-list :lang=ko | grep -qi "Noto Sans CJK\|Nanum"; then
            echo "❌ Korean font not found"
            exit 1
          fi

          echo "✅ Korean font detected"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi

      - name: Apply V3.2.1.2 production policy hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("main.py")
          main_source = main_path.read_text(encoding="utf-8")

          main_replacements = [
              (
                  "MAX_TOPIC_REGENERATIONS = 1",
                  "MAX_TOPIC_REGENERATIONS = 4",
              ),
              (
                  "NOVELTY_HARD_REGENERATE_SCORE = 5.0",
                  "NOVELTY_HARD_REGENERATE_SCORE = 4.0",
              ),
          ]

          for old, new in main_replacements:
              count = main_source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"main.py 패치 대상이 정확히 1개가 아닙니다: {old} (count={count})"
                  )
              main_source = main_source.replace(old, new, 1)

          main_path.write_text(main_source, encoding="utf-8")

          explorer_path = Path("content/candidate_explorer.py")
          explorer_source = explorer_path.read_text(encoding="utf-8")

          old_temp = "temperature=0.8,"
          new_temp = "temperature=0.5,"
          temp_count = explorer_source.count(old_temp)

          if temp_count != 1:
              raise RuntimeError(
                  "candidate_explorer.py temperature 패치 대상이 "
                  f"정확히 1개가 아닙니다: {old_temp} (count={temp_count})"
              )

          explorer_source = explorer_source.replace(
              old_temp,
              new_temp,
              1,
          )
          explorer_path.write_text(explorer_source, encoding="utf-8")

          consensus_path = Path("quality/consensus.py")
          consensus_source = consensus_path.read_text(encoding="utf-8")

          consensus_replacements = [
              (
                  "GOOD_ENOUGH_SCORE = 6.8",
                  "GOOD_ENOUGH_SCORE = 6.7",
              ),
              (
                  '    "hook": 7.0,',
                  '    "hook": 6.0,',
              ),
          ]

          for old, new in consensus_replacements:
              count = consensus_source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"consensus.py 패치 대상이 정확히 1개가 아닙니다: {old} (count={count})"
                  )
              consensus_source = consensus_source.replace(old, new, 1)

          consensus_path.write_text(consensus_source, encoding="utf-8")

          print("✅ Runtime production hotfix applied")
          PY

          grep -n "MAX_TOPIC_REGENERATIONS\|NOVELTY_HARD_REGENERATE_SCORE" main.py
          grep -n "temperature=0.5" content/candidate_explorer.py
          grep -n "GOOD_ENOUGH_SCORE\|\"hook\": 6.0" quality/consensus.py
          python -m py_compile main.py content/candidate_explorer.py quality/consensus.py

      - name: Run Shorts Generator V3.2
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ================================================
          # V3.2 Quality / Budget Guard
          # ================================================

          V3_JUDGE_MODEL: gpt-4o-mini

          # 최대 5번 Candidate 시도 + Rewrite + 재심까지 감당
          V3_MAX_API_CALLS: "30"

          # 한 번의 Shorts 실행당 추적 비용 상한
          V3_MAX_COST_USD: "0.05"

        run: |
          echo "========================================"
          echo "🚀 START SHORTS GENERATOR V3.2"
          echo "========================================"

          python main.py

          echo "========================================"
          echo "✅ SHORTS GENERATOR V3.2 FINISHED"
          echo "========================================"
