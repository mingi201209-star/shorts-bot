name: Production Topic Input Regression

on:
  pull_request:
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/topic_input_regression.yml"
      - "ci_topic_input_hotfix.py"
      - "quality/topic_input_regression_test.py"

jobs:
  topic-input-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply production hotfix chain
        run: |
          python ci_topic_input_hotfix.py
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          python ci_speech_style_hotfix.py
          python ci_hook_generation_hotfix.py
          python ci_hook_pool_guard_hotfix.py
          python ci_retention_hotfix.py

      - name: Compile topic input path
        run: |
          python -m py_compile \
            ci_topic_input_hotfix.py \
            main.py \
            content/candidate_explorer.py \
            quality/topic_input_regression_test.py

      - name: Run production topic input regression
        run: python quality/topic_input_regression_test.py
