name: Run 34703818223 Candidate Pool Supply Regression

on:
  pull_request:
    paths:
      - "quality/candidate_pool_handoff.py"
      - "ci_candidate_pool_handoff_hotfix.py"
      - "quality/run_34703818223_candidate_pool_supply_regression_test.py"
      - ".github/workflows/run_34703818223_candidate_pool_supply_regression.yml"
  push:
    branches:
      - "fix/run-34703818223-candidate-pool-supply-contract"
    paths:
      - "quality/candidate_pool_handoff.py"
      - "ci_candidate_pool_handoff_hotfix.py"
      - "quality/run_34703818223_candidate_pool_supply_regression_test.py"
      - ".github/workflows/run_34703818223_candidate_pool_supply_regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run candidate pool supply regression
        env:
          PYTHONPATH: .
        run: python quality/run_34703818223_candidate_pool_supply_regression_test.py
