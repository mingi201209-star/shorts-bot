name: Fixed Topic Consensus Call Regression

on:
  pull_request:
    paths:
      - "ci_script_v2_visual_goal_hotfix.py"
      - "quality/consensus.py"
      - "quality/fixed_topic_consensus_call_regression_test.py"
      - ".github/workflows/fixed-topic-consensus-call-regression.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python quality/fixed_topic_consensus_call_regression_test.py
