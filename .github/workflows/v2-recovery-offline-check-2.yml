name: V2 Recovery Offline Check 2

on:
  push:
    branches:
      - v2/recovery-offline-check-2-20260919

permissions:
  contents: read

jobs:
  offline-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Clean V2
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = sorted(Path("quality_core_v2").rglob("*.py"))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"compiled {len(files)} files")
          PY
      - name: Run Replay fixtures
        run: python -m quality_core_v2.replay
      - name: Run focused Clean V2 tests
        env:
          V3_MAX_API_CALLS: "60"
          V3_MAX_COST_USD: "0.05"
        run: |
          python -m pytest -q             quality_core_v2/replay_suite_test.py             quality_core_v2/adapters/adapters_test.py             quality_core_v2/downstream_test.py             quality_core_v2/selected_scene_renderer_test.py             quality_core_v2/topic_handoff_test.py
