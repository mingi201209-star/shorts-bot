name: Dispatch Throughput Production Once

on:
  push:
    branches:
      - agent/throughput-hook-quality-hotfix
    paths:
      - ".github/workflows/dispatch_throughput_production_once.yml"

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Discover dispatched production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              "branch": "agent/throughput-hook-quality-hotfix",
              "event": "workflow_dispatch",
              "per_page": 5,
          })
          url = f"https://api.github.com/repos/mingi201209-star/shorts-bot/actions/workflows/main.yml/runs?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          for run in payload.get("workflow_runs", []):
              print(
                  "PRODUCTION_RUN "
                  f"id={run.get('id')} status={run.get('status')} "
                  f"conclusion={run.get('conclusion')} head_sha={run.get('head_sha')} "
                  f"created_at={run.get('created_at')}"
              )
          PY
