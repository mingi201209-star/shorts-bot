name: Dispatch Throughput Production Once

on:
  push:
    branches:
      - agent/throughput-hook-quality-hotfix
    paths:
      - ".github/workflows/dispatch_throughput_production_once.yml"

permissions:
  actions: read
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Persist dispatched production workflow discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = "mingi201209-star/shorts-bot"
          branch = "agent/throughput-hook-quality-hotfix"
          query = urllib.parse.urlencode({
              "branch": branch,
              "event": "workflow_dispatch",
              "per_page": 5,
          })
          url = f"https://api.github.com/repos/{repo}/actions/workflows/main.yml/runs?{query}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          lines = []
          for run in payload.get("workflow_runs", []):
              lines.append(
                  "PRODUCTION_RUN "
                  f"id={run.get('id')} status={run.get('status')} "
                  f"conclusion={run.get('conclusion')} head_sha={run.get('head_sha')} "
                  f"created_at={run.get('created_at')}"
              )
          content = "\n".join(lines) + "\n"
          print(content)

          target = f"https://api.github.com/repos/{repo}/contents/production_run_discovery.txt"
          body = json.dumps({
              "message": "Record temporary production run discovery",
              "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
              "branch": branch,
          }).encode("utf-8")
          write_request = urllib.request.Request(
              target,
              data=body,
              method="PUT",
              headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(write_request) as response:
              print(f"persist_status={response.status}")
          PY
