name: Script Human Quality V1 Regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  script-human-quality-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Script Human Quality V1 regression
        run: python quality/script_human_quality_v1_regression_test.py
