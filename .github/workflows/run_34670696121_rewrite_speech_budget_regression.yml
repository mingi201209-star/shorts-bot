name: Run 34670696121 Rewrite Speech Budget Regression

on:
  pull_request:
    paths:
      - 'ci_speech_style_hotfix.py'
      - 'quality/run_34670696121_rewrite_speech_budget_regression_test.py'
      - '.github/workflows/run_34670696121_rewrite_speech_budget_regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply production-prefix hotfix chain
        run: |
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          python ci_speech_style_hotfix.py
      - name: Compile patched runtime and regression
        run: |
          python -m py_compile quality/rewrite_engine.py quality/run_34670696121_rewrite_speech_budget_regression_test.py
      - name: Run exact production counterexample
        run: python -m quality.run_34670696121_rewrite_speech_budget_regression_test
