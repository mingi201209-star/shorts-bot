name: Run 33299731082 Parent Domain Propagation Regression

on:
  pull_request:
    paths:
      - "ci_still_parent_domain_propagation_hotfix.py"
      - "ci_still_vision_evidence_trace_hotfix.py"
      - "quality/run_33299731082_parent_domain_propagation_regression_test.py"
      - ".github/workflows/run_33299731082_parent_domain_propagation_regression.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Compile focused patch
        run: |
          python -m py_compile \
            ci_still_parent_domain_propagation_hotfix.py \
            ci_still_vision_evidence_trace_hotfix.py \
            quality/run_33299731082_parent_domain_propagation_regression_test.py
      - name: Run exact LIVE counterexample regression
        run: python quality/run_33299731082_parent_domain_propagation_regression_test.py

  visual-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - quality/run_33254306556_still_pass_propagation_regression_test.py
          - quality/run_33259567582_still_vision_evidence_regression_test.py
          - quality/run_33298087222_scene1_still_subject_proof_regression_test.py
          - quality/still_image_verifier_contract_regression_test.py
          - quality/canonical_subject_grounding_supply_regression_test.py
          - quality/run_33251901169_visual_supply_regression_test.py
          - quality/run_33248013901_visual_anchor_regression_test.py
          - quality/run_33256014054_flow_interface_visual_supply_regression_test.py
          - quality/run_33257939720_chevron_flow_mixing_visual_supply_regression_test.py
          - quality/final_visual_semantic_qa_regression_test.py
          - quality/first5_visual_contract_regression_test.py
          - quality/hook_visual_dominance_test.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run ${{ matrix.test }}
        run: python "${{ matrix.test }}"

  script-fact-retention:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - quality/script_engine_v2_regression_test.py
          - quality/fact_critical_regeneration_test.py
          - quality/aviation_candidate_context_regression_test.py
          - quality/aviation_candidate_specificity_regression_test.py
          - quality/retention_regression_test.py
          - quality/first5_retention_tts_regression_test.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run ${{ matrix.test }}
        run: python "${{ matrix.test }}"

  production-composition-no-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Compose still verifier hotfix chain without production
        run: |
          python ci_still_image_verifier_contract_hotfix.py
          python ci_still_vision_evidence_groups_hotfix.py
          python ci_still_vision_evidence_trace_hotfix.py
          grep -q "STILL_PARENT_DOMAIN_PROPAGATION_V1" video/still_image_fallback.py
          grep -q "raw_visible_subject_groups" video/still_image_fallback.py
          grep -q "effective_subject_groups" video/still_image_fallback.py
          python -m py_compile video/still_image_fallback.py video/hook_visual_dominance.py
