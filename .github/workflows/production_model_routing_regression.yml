name: Production Model Routing Regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify production-only premium writer routing
        run: |
          python -m py_compile config.py quality/budget_guard.py quality/production_model_routing_regression_test.py
          python -m quality.production_model_routing_regression_test
