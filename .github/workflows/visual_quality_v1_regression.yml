name: Visual Quality V1 Regression

on:
  pull_request:
    paths:
      - 'quality/final_visual_director.py'
      - 'quality/final_render_integrity.py'
      - 'quality/final_visual_semantic_qa.py'
      - 'quality/visual_diversity_preflight.py'
      - 'quality/visual_semantic_contract.py'
      - 'quality/visual_quality_regression_test.py'
      - 'quality/visual_quality_production_gate_regression_test.py'
      - 'quality/production_execution_trace.py'
      - 'quality/production_execution_trace_compare.py'
      - 'quality/production_execution_trace_regression_test.py'
      - 'video/subtitle_engine.py'
      - 'video/video_downloader.py'
      - 'ci_visual_quality_v1_hotfix.py'
      - 'ci_cross_process_video_dedupe_hotfix.py'
      - '.github/workflows/visual_quality_v1_regression.yml'
  workflow_dispatch:

jobs:
  visual-quality-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Static compile
        run: python -m py_compile quality/final_visual_director.py quality/final_render_integrity.py quality/final_visual_semantic_qa.py quality/visual_diversity_preflight.py quality/visual_semantic_contract.py quality/visual_quality_regression_test.py quality/visual_quality_production_gate_regression_test.py quality/production_execution_trace.py quality/production_execution_trace_compare.py quality/production_execution_trace_regression_test.py video/subtitle_engine.py video/video_downloader.py ci_visual_quality_v1_hotfix.py ci_cross_process_video_dedupe_hotfix.py
      - name: Counterexample regression
        run: |
          python -m quality.visual_quality_regression_test
          python quality/visual_quality_production_gate_regression_test.py
          python quality/production_execution_trace_regression_test.py
      - name: Preserve bounded cost and recovery contract
        run: |
          grep -n 'MAX_DIRECTOR_REPAIR_SCENES = 2' quality/final_visual_director.py
          grep -n 'MAX_DIRECTOR_RECOVERY_ROUNDS = 2' quality/final_visual_director.py
          grep -n 'list(candidates or \[\])\[:max_candidates\]' quality/final_visual_director.py
          grep -n 'scene_clips\[repair_index\] = create_scene' ci_visual_quality_v1_hotfix.py
