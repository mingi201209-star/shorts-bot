name: Production Operator Bridge Ref Regression

on:
  pull_request:
    paths:
      - ".github/workflows/production-operator-bridge.yml"
      - ".github/workflows/main.yml"
      - "quality/production_operator_bridge_ref_regression_test.py"
      - ".github/workflows/production_operator_bridge_ref_regression.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify bridge ref and expected SHA contract
        run: python quality/production_operator_bridge_ref_regression_test.py
