name: Spoiler Payoff Visual Contract Regression

on:
  pull_request:
    paths:
      - 'ci_script_v2_gunggeum_formal_ending_hotfix.py'
      - 'quality/spoiler_payoff_visual_contract_regression_test.py'
      - '.github/workflows/spoiler_payoff_visual_contract_regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce and verify Scene 12 spoiler payoff alignment
        run: python quality/spoiler_payoff_visual_contract_regression_test.py
