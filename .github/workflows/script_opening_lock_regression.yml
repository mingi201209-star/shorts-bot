name: Script Opening and Closing Lock Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "content/script_generator/__init__.py"
      - "ci_script_validation_recovery_hotfix.py"
      - "quality/script_opening_lock_regression_test.py"
      - "quality/script_wrapper_opening_order_regression_test.py"
      - "quality/script_closing_lock_regression_test.py"
      - ".github/workflows/script_opening_lock_regression.yml"

jobs:
  opening-closing-lock-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run approved opening lock regression
        run: python quality/script_opening_lock_regression_test.py
      - name: Run wrapper pre-validation opening-order regression
        run: python quality/script_wrapper_opening_order_regression_test.py
      - name: Run approved closing lock regression
        run: python quality/script_closing_lock_regression_test.py
