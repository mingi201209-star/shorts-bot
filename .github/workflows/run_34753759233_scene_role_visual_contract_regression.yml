name: Run 34753759233 Scene Role Visual Contract Regression

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "content/script_engine_v2_runner.py"
      - "video/visual_explanation.py"
      - "ci_run_34753759233_scene_role_grounded_keyword_hotfix.py"
      - "quality/run_34753759233_scene_role_visual_contract_regression_test.py"
      - ".github/workflows/run_34753759233_scene_role_visual_contract_regression.yml"
  pull_request:
    branches:
      - main
    paths:
      - "content/script_engine_v2_runner.py"
      - "video/visual_explanation.py"
      - "ci_run_34753759233_scene_role_grounded_keyword_hotfix.py"
      - "quality/run_34753759233_scene_role_visual_contract_regression_test.py"
      - ".github/workflows/run_34753759233_scene_role_visual_contract_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile fix and regression
        run: |
          python -m py_compile \
            ci_run_34753759233_scene_role_grounded_keyword_hotfix.py \
            video/visual_explanation.py \
            quality/run_34753759233_scene_role_visual_contract_regression_test.py
      - name: Run Run 549 scene-role visual contract regression
        run: python quality/run_34753759233_scene_role_visual_contract_regression_test.py
