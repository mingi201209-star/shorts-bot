name: Production Operator Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'RUN-SHORTS:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve exact requested main SHA and bounded topic
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          python .github/scripts/production_operator_bridge_parser.py "$REQUEST" "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch production on latest main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.request.outputs.sha }}
          SCOPE: ${{ steps.request.outputs.scope }}
          TOPIC_B64: ${{ steps.request.outputs.topic_b64 }}
        run: |
          set -euo pipefail
          TOPIC="$(printf '%s' "$TOPIC_B64" | base64 --decode)"
          gh workflow run main.yml --repo "$REPO" --ref main \
            -f expected_sha="$SHA" \
            -f candidate_scope="$SCOPE" \
            -f topic="$TOPIC" \
            -f youtube_upload=false
          echo "Dispatched main.yml from ref main with expected SHA $SHA, candidate scope ${SCOPE:-default}, and bounded topic ${TOPIC:-automatic}; youtube_upload=false"
