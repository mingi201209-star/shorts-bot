name: Run 34825745612 Legacy Hook Repair Regression

on:
  pull_request:
    paths:
      - 'ci_run_34825745612_legacy_hook_repair_hotfix.py'
      - 'ci_fixed_aviation_scope_contract_hotfix.py'
      - 'quality/run_34825745612_legacy_hook_repair_regression_test.py'
      - '.github/workflows/run_34825745612_legacy_hook_repair_regression.yml'
  workflow_dispatch:

jobs:
  exact-counterexample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile changed files
        run: |
          python -m py_compile ci_run_34825745612_legacy_hook_repair_hotfix.py
          python -m py_compile ci_fixed_aviation_scope_contract_hotfix.py
          python -m py_compile quality/run_34825745612_legacy_hook_repair_regression_test.py
      - name: Run exact production counterexample
        run: python quality/run_34825745612_legacy_hook_repair_regression_test.py
