name: Run 34616204901 Human Quality Regression

on:
  pull_request:
    paths:
      - "ci_run_34616204901_human_quality_hotfix.py"
      - "ci_run_34616204901_human_script_v2_hotfix.py"
      - "ci_aviation_context_signature_compat_hotfix.py"
      - "quality/human_quality_floor.py"
      - "quality/run_34616204901_human_quality_regression_test.py"
      - ".github/workflows/run_34616204901_human_quality_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-quality-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compose relevant runtime layers
        run: |
          python ci_general_scene_visual_parity_hotfix.py
          python ci_grounded_deterministic_explanation_hotfix.py
          python ci_run_34616204901_human_script_v2_hotfix.py
          python ci_run_34616204901_human_quality_hotfix.py
          python -m py_compile \
            ci_run_34616204901_human_quality_hotfix.py \
            ci_run_34616204901_human_script_v2_hotfix.py \
            quality/human_quality_floor.py \
            quality/run_34616204901_human_quality_regression_test.py \
            content/script_generator_router.py \
            content/script_engine_v2.py \
            content/script_engine_v2_validation.py \
            video/video_downloader.py \
            video/visual_explanation.py
      - name: Run human quality regression
        run: python quality/run_34616204901_human_quality_regression_test.py
