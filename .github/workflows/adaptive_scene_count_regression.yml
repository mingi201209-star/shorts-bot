name: Adaptive Scene Count Regression

on:
  pull_request:
    paths:
      - "ci_adaptive_scene_count_hotfix.py"
      - "quality/adaptive_scene_count_regression_test.py"
      - ".github/workflows/main.yml"
      - ".github/workflows/adaptive_scene_count_regression.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run adaptive scene-count regression
        run: python quality/adaptive_scene_count_regression_test.py
