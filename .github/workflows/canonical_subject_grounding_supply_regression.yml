name: Canonical Subject Grounding Supply Regression

on:
  pull_request:
    paths:
      - "quality/canonical_subject_grounding_supply.py"
      - "quality/canonical_subject_grounding_supply_regression_test.py"
      - "ci_canonical_subject_grounding_supply_hotfix.py"
      - "ci_candidate_supply_recovery_hotfix.py"
      - "ci_candidate_grounded_recovery_hotfix.py"
      - "ci_aviation_candidate_context_hotfix.py"
      - "ci_aviation_candidate_specificity_hotfix.py"
      - "ci_aviation_context_signature_compat_hotfix.py"
      - "ci_aviation_specificity_output_repair_hotfix.py"
      - "ci_aviation_specificity_projection_hotfix.py"
      - ".github/workflows/canonical_subject_grounding_supply_regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production Python dependencies
        run: pip install -r requirements.txt
      - name: Production-path Grounding Supply regression
        run: python -m quality.canonical_subject_grounding_supply_regression_test
      - name: Restore checkout after runtime installer regression
        run: |
          git reset --hard HEAD
          git clean -fd
      - name: Canonical Subject Grounding regression
        run: python quality/canonical_subject_grounding_regression_test.py
      - name: Candidate Grounded Recovery regression
        run: python quality/candidate_grounded_recovery_regression_test.py
      - name: FACT Critical regression
        run: python quality/fact_critical_regeneration_test.py
      - name: Script V2 regression
        run: python quality/script_engine_v2_regression_test.py
      - name: Visual Subject Anchor regression
        run: python quality/visual_subject_anchor_contract_v1_regression_test.py
