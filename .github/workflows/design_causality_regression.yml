name: Script Design Causality Focused Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "ci_design_causality_hotfix.py"
      - "quality/design_causality_regression_test.py"
      - ".github/workflows/design_causality_regression.yml"

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run script design causality focused regression
        run: python quality/design_causality_regression_test.py
