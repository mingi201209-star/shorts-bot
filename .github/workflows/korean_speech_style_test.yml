name: Korean Speech Style Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  speech-style-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply production hotfix chain
        run: |
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          python ci_speech_style_hotfix.py

          grep -n "SCRIPT GENERATION FAILED" main.py
          grep -n "FACT_CRITICAL CANDIDATE REGENERATION" main.py
          grep -n "validate_scenes_speech_style" content/script_generator.py
          grep -n "validate_script_speech_style" quality/rewrite_engine.py
          grep -n "validate_korean_speech_text" content/hook_experiment.py

      - name: Compile
        run: |
          python -m py_compile \
            ci_hotfix.py \
            ci_novelty_budget_hotfix.py \
            ci_fact_critical_hotfix.py \
            ci_speech_style_hotfix.py \
            main.py \
            content/script_generator.py \
            content/hook_experiment.py \
            quality/rewrite_engine.py \
            quality/korean_speech_style.py \
            quality/korean_speech_style_test.py

      - name: Run speech-style regression tests
        run: |
          PYTHONPATH=. python quality/korean_speech_style_test.py

      - name: Hook OFF regression
        env:
          ENABLE_HOOK_EXPERIMENT: "0"
        run: |
          PYTHONPATH=. python quality/hook_experiment_test.py
          python - <<'PY'
          from content.hook_experiment import hook_experiment_enabled
          assert not hook_experiment_enabled()
          print("✅ Hook OFF regression PASS")
          PY

      - name: Hook ON regression
        env:
          ENABLE_HOOK_EXPERIMENT: "1"
        run: |
          PYTHONPATH=. python quality/hook_experiment_test.py
          python - <<'PY'
          from content.hook_experiment import hook_experiment_enabled
          assert hook_experiment_enabled()
          print("✅ Hook ON regression PASS")
          PY
