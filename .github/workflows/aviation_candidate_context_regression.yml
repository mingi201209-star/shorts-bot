name: Aviation Candidate Context Regression

on:
  push:
    branches:
      - agent/aviation-candidate-context
      - fix/run-33887547463-observable-seed-supply
    paths:
      - "ci_aviation_candidate_context_hotfix.py"
      - "quality/aviation_candidate_context_regression_test.py"
      - ".github/workflows/main.yml"
      - ".github/workflows/aviation_candidate_context_regression.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ci_aviation_candidate_context_hotfix.py"
      - "quality/aviation_candidate_context_regression_test.py"
      - ".github/workflows/main.yml"
      - ".github/workflows/aviation_candidate_context_regression.yml"

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run focused regression
        run: python quality/aviation_candidate_context_regression_test.py
