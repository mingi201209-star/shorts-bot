name: Retention Story V1 Regression

on:
  pull_request:
    paths:
      - "ci_adaptive_scene_count_hotfix.py"
      - "quality/adaptive_scene_count_regression_test.py"
      - "quality/retention_story_v1_regression_test.py"
      - ".github/workflows/retention_story_v1_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile focused files
        run: python -m py_compile ci_adaptive_scene_count_hotfix.py quality/adaptive_scene_count_regression_test.py quality/retention_story_v1_regression_test.py
      - name: Adaptive scene-count regression
        run: python quality/adaptive_scene_count_regression_test.py
      - name: Retention Story V1 counterexample regression
        run: python quality/retention_story_v1_regression_test.py
      - name: Korean speech validator regression
        run: python quality/korean_speech_style_test.py
