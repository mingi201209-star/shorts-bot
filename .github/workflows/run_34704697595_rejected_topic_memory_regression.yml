name: Run 34704697595 Rejected Topic Memory Regression

on:
  pull_request:
    paths:
      - "quality/candidate_pool_handoff.py"
      - "ci_candidate_pool_handoff_hotfix.py"
      - "quality/run_34704697595_rejected_topic_memory_regression_test.py"
      - ".github/workflows/run_34704697595_rejected_topic_memory_regression.yml"
  push:
    branches:
      - "fix/run-34704697595-rejected-topic-memory"
    paths:
      - "quality/candidate_pool_handoff.py"
      - "ci_candidate_pool_handoff_hotfix.py"
      - "quality/run_34704697595_rejected_topic_memory_regression_test.py"
      - ".github/workflows/run_34704697595_rejected_topic_memory_regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rejected topic memory regression
        env:
          PYTHONPATH: .
        run: python quality/run_34704697595_rejected_topic_memory_regression_test.py
