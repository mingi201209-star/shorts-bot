name: One-shot Winglet Production Dispatch

on:
  push:
    branches:
      - ops/dispatch-winglet-production-20260823
    paths:
      - .github/workflows/ops_dispatch_winglet_once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Reuse or dispatch current-main production and record run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 6f93d33add1fe6590bed9cf527607cf531479df1
          MERGED_AT: 2026-08-23T13:04:43Z
          RESULT_PATH: ops/winglet_dispatch_result.json
          RESULT_BRANCH: ops/dispatch-winglet-production-20260823
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          find_run() {
            curl --fail-with-body -sS "${auth[@]}" \
              "$api/actions/workflows/main.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
            | jq -c --arg sha "$TARGET_SHA" --arg merged "$MERGED_AT" \
              '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $merged)] | sort_by(.created_at) | reverse | .[0] // empty'
          }

          run_json="$(find_run)"
          if [ -z "$run_json" ]; then
            curl --fail-with-body -sS "${auth[@]}" -X POST \
              "$api/actions/workflows/main.yml/dispatches" \
              -d '{"ref":"main","inputs":{"topic":"비행기 날개 끝의 윙렛은 왜 위로 꺾여 있을까","candidate_scope":"","youtube_upload":false,"youtube_privacy":"private"}}'
            for _ in $(seq 1 18); do
              sleep 5
              run_json="$(find_run)"
              [ -n "$run_json" ] && break
            done
          fi

          if [ -z "$run_json" ]; then
            echo "No current-main workflow_dispatch run discovered" >&2
            exit 1
          fi

          echo "$run_json" | jq .
          payload="$(echo "$run_json" | jq '{id,html_url,head_sha,status,conclusion,created_at,updated_at,event,run_number}')"
          encoded="$(printf '%s\n' "$payload" | base64 -w0)"

          existing_sha="$(curl -sS "${auth[@]}" "$api/contents/$RESULT_PATH?ref=$RESULT_BRANCH" | jq -r '.sha // empty')"
          if [ -n "$existing_sha" ]; then
            body="$(jq -nc --arg msg 'Record winglet production dispatch result' --arg content "$encoded" --arg branch "$RESULT_BRANCH" --arg sha "$existing_sha" '{message:$msg,content:$content,branch:$branch,sha:$sha}')"
          else
            body="$(jq -nc --arg msg 'Record winglet production dispatch result' --arg content "$encoded" --arg branch "$RESULT_BRANCH" '{message:$msg,content:$content,branch:$branch}')"
          fi
          curl --fail-with-body -sS "${auth[@]}" -X PUT "$api/contents/$RESULT_PATH" -d "$body" >/dev/null
          echo "Recorded production run result"
