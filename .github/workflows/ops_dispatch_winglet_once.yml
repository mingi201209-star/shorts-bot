name: One-shot Winglet Production Dispatch

on:
  push:
    branches:
      - ops/dispatch-winglet-production-20260823
    paths:
      - .github/workflows/ops_dispatch_winglet_once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current main production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d '{"ref":"main","inputs":{"topic":"비행기 날개 끝의 윙렛은 왜 위로 꺾여 있을까","candidate_scope":"","youtube_upload":false,"youtube_privacy":"private"}}'
          echo "Dispatched main.yml for current main"
