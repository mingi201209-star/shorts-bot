name: Production Hotfix Composition Gate

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "ci_*.py"
      - "quality/production_hotfix_chain.py"
      - "quality/apply_production_hotfix_chain.py"
      - "quality/production_hotfix_chain_structure_regression_test.py"
      - "quality/production_hotfix_execution_order.py"
      - "quality/production_hotfix_execution_order_regression_test.py"
      - "quality/ci_hotfix_idempotency_regression_test.py"
      - "quality/run_33759359725_wrapper_composition_regression_test.py"
      - "quality/final_visual_semantic_qa_regression_test.py"
      - "quality/run_33977099845_verified_still_rescue_regression_test.py"
      - "quality/production_model_routing_composition_regression_test.py"
      - "quality/run_34672661458_hook_floor_feedback_regression_test.py"
      - ".github/workflows/production_hotfix_composition_gate.yml"
      - "video/video_downloader.py"
      - "video/video_engine.py"
      - "video/still_image_fallback.py"
      - "quality/visual_diversity_preflight.py"
      - "content/**"
      - "main.py"
      - "config.py"
  pull_request:
    branches:
      - main
    paths:
      - "ci_*.py"
      - "quality/production_hotfix_chain.py"
      - "quality/apply_production_hotfix_chain.py"
      - "quality/production_hotfix_chain_structure_regression_test.py"
      - "quality/production_hotfix_execution_order.py"
      - "quality/production_hotfix_execution_order_regression_test.py"
      - "quality/ci_hotfix_idempotency_regression_test.py"
      - "quality/run_33759359725_wrapper_composition_regression_test.py"
      - "quality/final_visual_semantic_qa_regression_test.py"
      - "quality/run_33977099845_verified_still_rescue_regression_test.py"
      - "quality/production_model_routing_composition_regression_test.py"
      - "quality/run_34672661458_hook_floor_feedback_regression_test.py"
      - ".github/workflows/production_hotfix_composition_gate.yml"
      - "video/video_downloader.py"
      - "video/video_engine.py"
      - "video/still_image_fallback.py"
      - "quality/visual_diversity_preflight.py"
      - "content/**"
      - "main.py"
      - "config.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  composition-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify production hotfix chain structure
        run: python -m quality.production_hotfix_chain_structure_regression_test
      - name: Verify production hotfix execution order (including hidden chaining)
        run: python -m quality.production_hotfix_execution_order_regression_test
      - name: Verify ci_hotfix.py survives a second application (idempotency)
        run: python -m quality.ci_hotfix_idempotency_regression_test
      - name: Apply exact production hotfix composition
        run: |
          set -euo pipefail
          python quality/apply_production_hotfix_chain.py
      - name: Assert Run 34673458379 Hook feedback final composition
        run: |
          grep -q "# FIXED_TOPIC_HOOK_EXHAUSTION_RECOVERY_V1" main.py
          grep -q "# RUN_34672661458_HOOK_FLOOR_FEEDBACK_V1" main.py
          python quality/run_34672661458_hook_floor_feedback_regression_test.py
      - name: Compile composed production surface
        run: |
          python -m py_compile \
            quality/production_hotfix_chain.py quality/apply_production_hotfix_chain.py \
            quality/production_hotfix_chain_structure_regression_test.py \
            quality/production_hotfix_execution_order.py \
            quality/production_hotfix_execution_order_regression_test.py \
            quality/ci_hotfix_idempotency_regression_test.py \
            ci_run_33691170895_term_visual_subject_hotfix.py \
            ci_aviation_context_signature_compat_hotfix.py \
            ci_final_visual_semantic_qa_hotfix.py \
            ci_run_34847558126_fixed_topic_novelty_weak_domain_hotfix.py \
            quality/run_34847558126_fixed_topic_novelty_weak_domain_regression_test.py \
            ci_run_34847558126_scene_role_grounded_keyword_hotfix.py \
            ci_writer_observable_opening_hotfix.py \
            ci_run_33977099845_verified_still_rescue_hotfix.py \
            ci_run_34672661458_hook_floor_feedback_hotfix.py \
            quality/run_33759359725_wrapper_composition_regression_test.py \
            quality/final_visual_semantic_qa_regression_test.py \
            quality/run_33977099845_verified_still_rescue_regression_test.py \
            quality/production_model_routing_composition_regression_test.py \
            quality/run_34672661458_hook_floor_feedback_regression_test.py \
            quality/visual_diversity_preflight.py \
            video/still_image_fallback.py \
            video/video_downloader.py \
            video/video_engine.py \
            content/script_engine_v2_runner.py \
            content/script_generator_router.py
      - name: Run wrapper composition authority regression
        run: python quality/run_33759359725_wrapper_composition_regression_test.py
      - name: Run Final Visual Semantic QA regression
        env:
          AI_VISUAL_FALLBACK_ENABLED: "false"
          AI_MAX_GENERATIONS_PER_VIDEO: "1"
        run: python quality/final_visual_semantic_qa_regression_test.py
      - name: Run 33977099845 verified still rescue regression
        env:
          AI_VISUAL_FALLBACK_ENABLED: "false"
        run: python quality/run_33977099845_verified_still_rescue_regression_test.py
      - name: Run production model routing composition regression
        run: python quality/production_model_routing_composition_regression_test.py
      - name: Assert no production side effects
        run: |
          ! grep -q "workflow_dispatch.*main.yml" .github/workflows/production_hotfix_composition_gate.yml
          ! grep -q "OPENAI_KEY\|PEXELS_API_KEY\|PIXABAY_API_KEY\|YOUTUBE" .github/workflows/production_hotfix_composition_gate.yml
          echo PRODUCTION_SIDE_EFFECTS=0
          echo NEW_LLM_CALLS=0
          echo NEW_VISION_CALLS=0
          echo NEW_IMAGE_GENERATION_CALLS=0
