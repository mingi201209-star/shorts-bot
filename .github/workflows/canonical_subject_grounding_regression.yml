name: Canonical Subject Grounding Regression

on:
  pull_request:
    paths:
      - "quality/canonical_subject_grounding.py"
      - "quality/canonical_subject_grounding_regression_test.py"
      - "quality/canonical_subject_grounding_production_wiring_regression_test.py"
      - "quality/judge.py"
      - "main.py"
      - "content/candidate_explorer.py"
      - "ci_candidate_supply_recovery_hotfix.py"
      - "ci_canonical_subject_grounding_hotfix.py"
      - ".github/workflows/canonical_subject_grounding_regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Focused Canonical Subject Grounding regression
        run: python -m quality.canonical_subject_grounding_regression_test
      - name: Apply production grounding composition
        run: python ci_candidate_supply_recovery_hotfix.py
      - name: Production boundary wiring regression
        run: python -m quality.canonical_subject_grounding_production_wiring_regression_test
      - name: Syntax check touched runtime surfaces
        run: |
          python -m py_compile \
            quality/canonical_subject_grounding.py \
            ci_canonical_subject_grounding_hotfix.py \
            ci_candidate_supply_recovery_hotfix.py \
            content/candidate_explorer.py \
            quality/judge.py \
            main.py
