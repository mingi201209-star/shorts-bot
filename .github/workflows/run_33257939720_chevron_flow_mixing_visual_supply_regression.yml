name: Run 33257939720 Chevron Flow Mixing Visual Supply Regression

on:
  pull_request:
    paths:
      - "video/grounded_explanatory_visual.py"
      - "video/visual_explanation.py"
      - "ci_grounded_explanatory_visual_supply_hotfix.py"
      - "ci_still_vision_evidence_groups_hotfix.py"
      - "ci_still_vision_evidence_trace_hotfix.py"
      - "ci_final_visual_semantic_qa_hotfix.py"
      - "quality/run_33259567582_still_vision_evidence_regression_test.py"
      - "quality/run_33257939720_chevron_flow_mixing_visual_supply_regression_test.py"
      - ".github/workflows/run_33257939720_chevron_flow_mixing_visual_supply_regression.yml"

permissions:
  contents: read

jobs:
  focused-supply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m py_compile \
            video/grounded_explanatory_visual.py \
            ci_grounded_explanatory_visual_supply_hotfix.py \
            quality/run_33257939720_chevron_flow_mixing_visual_supply_regression_test.py
          git diff --check
      - name: Run 33257939720 Scene 4 counterexamples
        run: |
          git reset --hard HEAD && git clean -fd
          python quality/run_33257939720_chevron_flow_mixing_visual_supply_regression_test.py
      - name: Preserve 257 FLOW_INTERFACE
        run: |
          git reset --hard HEAD && git clean -fd
          python quality/run_33256014054_flow_interface_visual_supply_regression_test.py
      - name: Visual explanation retrieval
        run: |
          git reset --hard HEAD && git clean -fd
          python quality/visual_explanation_retrieval_v1_regression_test.py
          git reset --hard HEAD && git clean -fd
          python quality/visual_explanation_retrieval_v1_contract_test.py
      - name: Visual subject and canonical supply
        run: |
          git reset --hard HEAD && git clean -fd
          python quality/visual_subject_anchor_contract_v1_regression_test.py
          git reset --hard HEAD && git clean -fd
          python quality/run_33248013901_visual_anchor_regression_test.py
          git reset --hard HEAD && git clean -fd
          python quality/run_33251901169_visual_supply_regression_test.py
      - name: Still verifier, 256 propagation, and fixed budget
        run: |
          git reset --hard HEAD && git clean -fd
          python quality/still_image_verifier_contract_regression_test.py
          git reset --hard HEAD && git clean -fd
          python quality/run_33254306556_still_pass_propagation_regression_test.py
          git reset --hard HEAD && git clean -fd
          python quality/still_image_budget_regression_test.py
      - name: Final visual semantic QA
        env:
          AI_VISUAL_FALLBACK_ENABLED: "false"
          AI_MAX_GENERATIONS_PER_VIDEO: "1"
        run: |
          git reset --hard HEAD && git clean -fd
          python ci_video_provider_hotfix.py
          python ci_final_render_content_integrity_hotfix.py
          python ci_output_quality_hotfix.py
          python ci_visual_specificity_hotfix.py
          python ci_query_semantic_integrity_hotfix.py
          python ci_concrete_visual_evidence_hotfix.py
          python ci_visible_evidence_provenance_hotfix.py
          python ci_general_scene_visual_parity_hotfix.py
          python ci_final_visual_semantic_qa_hotfix.py
          python quality/final_visual_semantic_qa_regression_test.py
          python quality/still_image_motion_fallback_regression_test.py

  protected-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Script Engine V2 and Retention Story V2
        run: |
          git reset --hard HEAD && git clean -fd
          python ci_script_v2_visual_goal_hotfix.py
          python -m quality.retention_story_v2_production_counterexample_test
          python -m quality.script_engine_v2_regression_test
          python -m quality.script_engine_v2_failure_fixtures_test
          python -m quality.script_engine_v2_runner_regression_test
          python -m quality.script_engine_v2_grounded_claim_plan_regression_test
      - name: FACT Critical
        run: |
          git reset --hard HEAD && git clean -fd
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          PYTHONPATH=. python quality/fact_critical_regeneration_test.py
      - name: Aviation context and specificity
        run: |
          git reset --hard HEAD && git clean -fd
          python quality/aviation_candidate_context_regression_test.py
          git reset --hard HEAD && git clean -fd
          python quality/aviation_candidate_specificity_regression_test.py
          git reset --hard HEAD && git clean -fd
          python quality/aviation_specificity_projection_regression_test.py
      - name: Visual diversity
        run: |
          git reset --hard HEAD && git clean -fd
          python quality/visual_diversity_preflight_regression_test.py
      - name: Visual Quality
        run: |
          git reset --hard HEAD && git clean -fd
          python -m quality.visual_quality_regression_test
      - name: Preserve zero-call deterministic contract
        run: |
          grep -n 'STILL_IMAGE_MAX_PER_VIDEO = int(os.environ.get("STILL_IMAGE_MAX_PER_VIDEO", "2"))' video/still_image_fallback.py
          grep -n 'additional_llm_calls.*0' ci_grounded_explanatory_visual_supply_hotfix.py
          grep -n 'additional_vision_calls.*0' ci_grounded_explanatory_visual_supply_hotfix.py
