name: Visual Explanation Retrieval V1 Regression

on:
  pull_request:
    paths:
      - "video/visual_explanation.py"
      - "ci_visual_explanation_retrieval_v1_hotfix.py"
      - "ci_visual_claim_semantic_fallback_hotfix.py"
      - "ci_cross_process_video_dedupe_hotfix.py"
      - "quality/visual_explanation_retrieval_v1_regression_test.py"
      - "quality/visual_explanation_retrieval_v1_contract_test.py"
      - ".github/workflows/visual_explanation_retrieval_v1_regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Static and focused regression
        run: |
          python -m py_compile video/visual_explanation.py ci_visual_explanation_retrieval_v1_hotfix.py quality/visual_explanation_retrieval_v1_regression_test.py quality/visual_explanation_retrieval_v1_contract_test.py
          python quality/visual_explanation_retrieval_v1_regression_test.py
          python quality/visual_explanation_retrieval_v1_contract_test.py
          git diff --check
