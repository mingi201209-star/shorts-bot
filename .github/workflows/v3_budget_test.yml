name: V3 Budget Guard Test

on:
  workflow_dispatch:

jobs:
  budget-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V3.2 Budget Guard test
        run: |
          python -m quality.budget_guard_test
