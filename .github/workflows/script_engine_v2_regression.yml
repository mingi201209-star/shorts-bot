name: Script Engine V2 Regression

on:
  pull_request:
    paths:
      - "content/retention_structure.py"
      - "content/script_formal_endings.py"
      - "content/script_engine_v2.py"
      - "content/script_engine_v2_runner.py"
      - "content/script_engine_v2_validation.py"
      - "content/script_generator_router.py"
      - "ci_script_v2_visual_goal_hotfix.py"
      - "ci_script_v2_gunggeum_formal_ending_hotfix.py"
      - "quality/retention_story_v2_production_counterexample_test.py"
      - "quality/script_engine_v2_*"
      - "quality/script_generator_router_regression_test.py"
      - ".github/workflows/script_engine_v2_regression.yml"
  workflow_dispatch:

jobs:
  v2-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: python -m pip install openai

      - name: Apply established V2 base hotfix
        run: python ci_script_v2_visual_goal_hotfix.py

      - name: Compile V2 modules
        run: |
          python -m py_compile \
            ci_script_v2_visual_goal_hotfix.py \
            content/retention_structure.py \
            content/script_engine_v2.py \
            content/script_engine_v2_runner.py \
            content/script_engine_v2_validation.py \
            content/script_generator_router.py \
            quality/retention_story_v2_production_counterexample_test.py \
            quality/script_engine_v2_regression_test.py \
            quality/script_engine_v2_opening_role_contract_regression_test.py \
            quality/script_engine_v2_failure_fixtures_test.py \
            quality/script_engine_v2_runner_regression_test.py \
            quality/script_engine_v2_text_alias_regression_test.py \
            quality/script_engine_v2_run_32696711123_regression_test.py \
            quality/script_generator_router_regression_test.py \
            quality/canonical_subject_grounding_regression_test.py

      - name: Retention Story V2 production counterexample
        run: python -m quality.retention_story_v2_production_counterexample_test

      - name: Opening Role Contract regression
        run: python -m quality.script_engine_v2_opening_role_contract_regression_test

      - name: Deterministic narrative plan regression
        run: python -m quality.script_engine_v2_regression_test

      - name: Production failure fixtures
        run: python -m quality.script_engine_v2_failure_fixtures_test

      - name: Bounded writer orchestration
        run: python -m quality.script_engine_v2_runner_regression_test

      - name: Run 32696711123 terminal recovery fixture
        run: python -m quality.script_engine_v2_run_32696711123_regression_test

      - name: Writer text alias normalization
        run: python -m quality.script_engine_v2_text_alias_regression_test

      - name: Legacy-safe router regression
        run: python -m quality.script_generator_router_regression_test

      - name: Enforce Script API ceiling
        run: |
          python - <<'PY'
          from content.script_engine_v2 import MAX_SCRIPT_API_CALLS, MAX_LOCAL_REPAIR_CALLS
          assert MAX_SCRIPT_API_CALLS == 3
          assert MAX_LOCAL_REPAIR_CALLS == 2
          print("PASS: writer 1 + local repair <= 2")
          PY

      - name: Canonical Subject Grounding regression
        run: python -m quality.canonical_subject_grounding_regression_test
