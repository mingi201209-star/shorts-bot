name: Aviation Candidate Specificity Regression

on:
  pull_request:

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run aviation candidate specificity regression
        env:
          SHORTS_CANDIDATE_SCOPE: aviation
          AI_VISUAL_FALLBACK_ENABLED: "false"
        run: python quality/aviation_candidate_specificity_regression_test.py
