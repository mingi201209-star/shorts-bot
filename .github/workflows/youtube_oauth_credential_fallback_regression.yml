name: YouTube OAuth Credential Fallback Regression

on:
  push:
    branches:
      - "ops/**"
      - "fix/**"
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/youtube_analytics_ingestion.yml"
      - ".github/workflows/publish_engine.yml"
      - "quality/youtube_oauth_credential_fallback_regression_test.py"
      - ".github/workflows/youtube_oauth_credential_fallback_regression.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/youtube_analytics_ingestion.yml"
      - ".github/workflows/publish_engine.yml"
      - "quality/youtube_oauth_credential_fallback_regression_test.py"
      - ".github/workflows/youtube_oauth_credential_fallback_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML for workflow syntax validation
        run: pip install pyyaml
      - name: Validate edited workflow YAML syntax
        run: |
          python3 -c "
          import yaml
          for f in ['.github/workflows/main.yml', '.github/workflows/youtube_analytics_ingestion.yml', '.github/workflows/publish_engine.yml']:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f, 'OK')
          "
      - name: Run OAuth credential fallback regression
        run: python quality/youtube_oauth_credential_fallback_regression_test.py
