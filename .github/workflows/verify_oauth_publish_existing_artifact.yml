name: Verify OAuth Publish (Existing Artifact)

# Purpose: close the YouTube OAuth verification loop end to end WITHOUT
# generating any new video. Downloads an already-existing verified-shorts-*
# artifact from a past successful production run and runs ONLY the publish
# step against it. Privacy is hardcoded to "private" -- there is no input
# to make this workflow post publicly. Never echoes secret values; only
# presence booleans are ever printed.

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run ID whose verified-shorts-* artifact should be reused (no new video is generated)"
        required: true
        type: string
      artifact_name:
        description: "Exact verified-shorts-* artifact name to download and publish"
        required: true
        type: string
      topic_title:
        description: "Title/topic to record in lineage (does not affect the reused video's content)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-oauth-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download existing verified artifact (no new video generated)
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Confirm reused artifact and OAuth credential presence (no secret values)
        env:
          YOUTUBE_ANALYTICS_CLIENT_ID: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YOUTUBE_ANALYTICS_CLIENT_SECRET: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          echo "Reused artifact contents:"
          ls -la final_shorts_*.mp4 final_visual_semantic_qa.json final_director_qa.json visual_diversity_preflight.json 2>/dev/null || true
          python - <<'PY'
          import os
          for name in (
              "YOUTUBE_ANALYTICS_CLIENT_ID",
              "YOUTUBE_ANALYTICS_CLIENT_SECRET",
              "YOUTUBE_ANALYTICS_REFRESH_TOKEN",
          ):
              value = os.environ.get(name, "")
              print(f"OAUTH_CREDENTIAL_PRESENCE {name}: present={bool(value.strip())}")
          PY

      - name: Publish reused artifact to YouTube (private) and persist lineage
        env:
          ENABLE_YOUTUBE_UPLOAD: "1"
          SHORTS_YOUTUBE_PRIVACY: "private"
          SHORTS_YOUTUBE_TITLE: ${{ inputs.topic_title }}
          SHORTS_TOPIC: ${{ inputs.topic_title }}
          SHORTS_CANDIDATE_SCOPE: ""
          SHORTS_ANALYTICS_HISTORY_PATH: analytics/performance_history.json
          YOUTUBE_ANALYTICS_CLIENT_ID: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YOUTUBE_ANALYTICS_CLIENT_SECRET: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN }}
        run: python -m analytics.publish_and_persist

      - name: Preserve analytics history
        if: ${{ hashFiles('analytics/performance_history.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: oauth-verify-analytics-history-${{ github.run_id }}
          path: analytics/performance_history.json
          retention-days: 90
