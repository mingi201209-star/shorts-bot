name: Prepare or Publish Shorts Studio Artifact

on:
  workflow_dispatch:
    inputs:
      studio_run_id:
        description: "Successful shorts-studio render-smoke workflow run ID"
        required: true
        type: string
      studio_artifact_name:
        description: "Exact artifact name from that Studio run"
        required: true
        type: string
      title:
        description: "Exact YouTube title (use the same value for preparation and publishing)"
        required: true
        type: string
      privacy:
        description: "YouTube visibility"
        required: true
        default: private
        type: choice
        options:
          - private
          - unlisted
          - public
      expected_sha256:
        description: "SHA-256 shown by the prepare-only run; required when confirm_upload is true"
        required: false
        default: ""
        type: string
      confirm_upload:
        description: "Set true only with the reviewed SHA-256, title, and visibility"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: studio-artifact-publish-${{ inputs.studio_run_id }}-${{ inputs.studio_artifact_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify source run and download Studio artifact
        env:
          GH_TOKEN: ${{ secrets.SHORTS_STUDIO_ARTIFACT_READ_TOKEN }}
          STUDIO_RUN_ID: ${{ inputs.studio_run_id }}
          STUDIO_ARTIFACT_NAME: ${{ inputs.studio_artifact_name }}
          STUDIO_TITLE: ${{ inputs.title }}
          STUDIO_PRIVACY: ${{ inputs.privacy }}
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "SHORTS_STUDIO_ARTIFACT_READ_TOKEN is not configured"; exit 1; }
          case "$STUDIO_RUN_ID" in *[!0-9]*|'') echo "Invalid Studio run ID"; exit 1;; esac
          test -n "$STUDIO_ARTIFACT_NAME"
          run_json="$(gh api "repos/mingi201209-star/shorts-studio/actions/runs/$STUDIO_RUN_ID")"
          test "$(jq -r .status <<<"$run_json")" = completed
          test "$(jq -r .conclusion <<<"$run_json")" = success
          echo "source_workflow=$(jq -r .name <<<"$run_json")" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r .head_sha <<<"$run_json")" >> "$GITHUB_OUTPUT"
        id: source

      - name: Download exact artifact from Shorts Studio
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.studio_artifact_name }}
          repository: mingi201209-star/shorts-studio
          run-id: ${{ inputs.studio_run_id }}
          github-token: ${{ secrets.SHORTS_STUDIO_ARTIFACT_READ_TOKEN }}
          path: studio-artifact

      - name: Validate video and show review package
        env:
          STUDIO_RUN_ID: ${{ inputs.studio_run_id }}
          STUDIO_ARTIFACT_NAME: ${{ inputs.studio_artifact_name }}
          STUDIO_TITLE: ${{ inputs.title }}
          STUDIO_PRIVACY: ${{ inputs.privacy }}
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python quality/studio_artifact_contract.py studio-artifact --manifest upload-package.json
          actual_sha="$(jq -r .sha256 upload-package.json)"
          if [ "$CONFIRM_UPLOAD" = "true" ]; then
            test "${#EXPECTED_SHA256}" -eq 64 || { echo "Reviewed SHA-256 is required before upload"; exit 1; }
            case "$EXPECTED_SHA256" in *[!0-9a-fA-F]*) echo "Invalid expected SHA-256"; exit 1;; esac
            test "${actual_sha,,}" = "${EXPECTED_SHA256,,}" || { echo "Studio artifact SHA-256 differs from reviewed package"; exit 1; }
          fi
          cat upload-package.json
          {
            echo "## Shorts Studio upload package"
            echo "- Source run: $STUDIO_RUN_ID ($SOURCE_SHA)"
            echo "- Artifact: $STUDIO_ARTIFACT_NAME"
            echo "- Title: $STUDIO_TITLE"
            echo "- Visibility: $STUDIO_PRIVACY"
            echo "- Upload enabled: $CONFIRM_UPLOAD"
            echo "- SHA-256: $actual_sha"
            echo "- Duration: $(jq -r .duration_seconds upload-package.json) seconds"
            echo ""
            echo "Description is preserved from the Studio artifact at dist/upload-description.txt."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p staged
          cp studio-artifact/dist/final.mp4 staged/final.mp4
          cp studio-artifact/dist/captions.srt staged/captions.srt
          cp studio-artifact/dist/upload-description.txt staged/upload-description.txt
          cp studio-artifact/dist/qa_report.json staged/qa_report.json
          cp upload-package.json staged/upload-package.json

      - name: Preserve prepared upload package
        uses: actions/upload-artifact@v4
        with:
          name: prepared-studio-short-${{ inputs.studio_run_id }}-${{ github.run_id }}
          path: staged/
          if-no-files-found: error
          retention-days: 90

      - name: Install Python dependencies for YouTube publishing
        if: ${{ inputs.confirm_upload }}
        run: pip install -r requirements.txt

      - name: Publish reviewed Studio artifact and persist lineage
        if: ${{ inputs.confirm_upload }}
        env:
          ENABLE_YOUTUBE_UPLOAD: "1"
          SHORTS_VIDEO_PATH: staged/final.mp4
          SHORTS_YOUTUBE_TITLE: ${{ inputs.title }}
          SHORTS_YOUTUBE_PRIVACY: ${{ inputs.privacy }}
          SHORTS_TOPIC: ${{ inputs.title }}
          SHORTS_CANDIDATE_SCOPE: "shorts-studio"
          SHORTS_ANALYTICS_HISTORY_PATH: analytics/performance_history.json
          YOUTUBE_ANALYTICS_CLIENT_ID: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YOUTUBE_ANALYTICS_CLIENT_SECRET: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          export SHORTS_YOUTUBE_DESCRIPTION="$(cat staged/upload-description.txt)"
          python -m analytics.publish_and_persist

      - name: Preserve YouTube lineage history
        if: ${{ inputs.confirm_upload && hashFiles('analytics/performance_history.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-upload-lineage-${{ github.run_id }}
          path: analytics/performance_history.json
          retention-days: 90
