name: Mobile Code Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: mobile-code-agent
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.issue.number == 33 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/agent-run ')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse bounded owner request
        id: request
        env:
          BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          prefix = "/agent-run "
          body = os.environ["BODY"]
          if not body.startswith(prefix):
              raise SystemExit("Invalid mobile agent command prefix.")
          request = body[len(prefix):].strip()
          if not request:
              raise SystemExit("Mobile agent request is empty.")
          if len(request) > 4000:
              raise SystemExit("Mobile agent request exceeds 4000 characters.")

          base = Path(".github/codex/prompts/mobile-code-agent.md").read_text(encoding="utf-8")
          Path(".mobile-agent-runtime-prompt.md").write_text(
              base + "\n\n## Owner request\n\n" + request + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create isolated working branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="mobile-agent/run-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Verify API key presence
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_KEY"

      - name: Patch with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_KEY }}
          prompt-file: .mobile-agent-runtime-prompt.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          effort: low
          allow-users: ${{ github.repository_owner }}
          codex-args: '["--ephemeral"]'

      - name: Remove runtime prompt
        if: always()
        shell: bash
        run: rm -f .mobile-agent-runtime-prompt.md

      - name: Detect patch
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce mobile agent safety policy
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          python - <<'PY'
          import re
          import subprocess
          import sys

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          protected_files = {
              ".github/workflow-dispatch-allowlist.json",
              ".github/workflows/pr-landing.yml",
              ".github/workflows/production-operator-bridge.yml",
              ".github/workflows/shorts_operator_dispatch.yml",
              ".github/workflows/mobile_code_agent.yml",
              ".github/codex/prompts/mobile-code-agent.md",
          }
          touched = sorted(set(changed) & protected_files)
          if touched:
              print("Protected control files changed: " + ", ".join(touched), file=sys.stderr)
              sys.exit(20)

          diff = subprocess.check_output(["git", "diff", "--unified=0"], text=True)
          sensitive = re.compile(
              r"(V3_MAX_COST_USD|V3_MAX_API_CALLS|HOOK_THRESHOLD|semantic_match|"
              r"subject_visibility|mobile_clarity|obstruction_risk|youtube_upload\s*[=:]\s*true|"
              r"youtube_privacy\s*[=:]\s*public)",
              re.IGNORECASE,
          )
          for line in diff.splitlines():
              if not line or line.startswith(("+++", "---", "@@")):
                  continue
              if line[0] in "+-" and sensitive.search(line[1:]):
                  print("Sensitive safety/cost/quality boundary line changed: " + line, file=sys.stderr)
                  sys.exit(21)
          PY

      - name: Syntax-check changed Python files
        if: steps.diff.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -z "$file" || ! -f "$file" ]] && continue
            case "$file" in
              *.py) python -m py_compile "$file" ;;
            esac
          done < <(git diff --name-only)

      - name: Run changed focused regression files
        if: steps.diff.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ran=0
          while IFS= read -r file; do
            [[ -z "$file" || ! -f "$file" ]] && continue
            case "$file" in
              quality/*regression*.py|quality/*test*.py)
                echo "Running changed focused regression: $file"
                timeout 180 python "$file"
                ran=1
                ;;
            esac
          done < <(git diff --name-only)
          if [[ "$ran" == "0" ]]; then
            echo "No changed focused regression file to execute; Codex-requested verification remains recorded in its result."
          fi

      - name: Commit and push bounded patch
        id: push
        if: steps.diff.outputs.has_changes == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "shorts-mobile-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mobile agent bounded patch"
          git push origin "HEAD:$BRANCH"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open review-only PR
        id: pr
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.name }}
          HEAD_SHA: ${{ steps.push.outputs.head }}
          RESULT: ${{ steps.codex.outputs.final-message }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          {
            echo "Mobile Code Agent bounded patch."
            echo
            echo "Head SHA: \`$HEAD_SHA\`"
            echo
            echo "The agent cannot merge or dispatch production. Owner landing approval is still required."
            echo
            echo "### Agent report"
            printf '%s\n' "$RESULT" | head -c 12000
          } > "$body_file"

          pr_url="$(gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Mobile agent bounded patch" \
            --body-file "$body_file")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Record mobile agent checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HAS_CHANGES: ${{ steps.diff.outputs.has_changes }}
          PR_URL: ${{ steps.pr.outputs.url }}
          HEAD_SHA: ${{ steps.push.outputs.head }}
          RESULT: ${{ steps.codex.outputs.final-message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAS_CHANGES" == "true" ]]; then
            gh issue comment 33 --repo "$REPO" --body "Mobile agent finished. Review-only PR: ${PR_URL}. Exact head: ${HEAD_SHA}. Merge and production remain locked behind owner approval."
          else
            summary="$(printf '%s' "$RESULT" | head -c 8000)"
            gh issue comment 33 --repo "$REPO" --body "Mobile agent finished without a code patch. No PR was opened.\n\n${summary}"
          fi

      - name: Record mobile agent failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh issue comment 33 --repo "$REPO" --body "Mobile agent stopped safely before landing. No automatic merge or production dispatch occurred. Inspect: ${RUN_URL}"
