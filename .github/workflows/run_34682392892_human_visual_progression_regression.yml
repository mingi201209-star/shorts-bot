name: Run 34682392892 Human Visual Progression Regression

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "ci_run_34682392892_human_visual_progression_hotfix.py"
      - "ci_aviation_context_signature_compat_hotfix.py"
      - "quality/run_34682392892_human_visual_progression_regression_test.py"
      - ".github/workflows/run_34682392892_human_visual_progression_regression.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ci_run_34682392892_human_visual_progression_hotfix.py"
      - "ci_aviation_context_signature_compat_hotfix.py"
      - "quality/run_34682392892_human_visual_progression_regression_test.py"
      - ".github/workflows/run_34682392892_human_visual_progression_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Run 526 authority patch and regression
        run: |
          python -m py_compile \
            ci_run_34682392892_human_visual_progression_hotfix.py \
            ci_aviation_context_signature_compat_hotfix.py \
            quality/run_34682392892_human_visual_progression_regression_test.py
      - name: Run Run 526 production-composition regression
        run: python quality/run_34682392892_human_visual_progression_regression_test.py
