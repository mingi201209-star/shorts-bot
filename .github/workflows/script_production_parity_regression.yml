name: Script Production Parity Focused Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "ci_script_production_parity_hotfix.py"
      - "quality/script_production_parity_regression_test.py"
      - ".github/workflows/script_production_parity_regression.yml"
      - ".github/workflows/main.yml"

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run script production parity regression
        env:
          AI_VISUAL_FALLBACK_ENABLED: "false"
          AI_MAX_GENERATIONS_PER_VIDEO: "1"
        run: python quality/script_production_parity_regression_test.py
      - name: Preserve #30 causal regression
        env:
          AI_VISUAL_FALLBACK_ENABLED: "false"
          AI_MAX_GENERATIONS_PER_VIDEO: "1"
        run: python quality/causal_information_progression_regression_test.py
      - name: Preserve #29 OFF-mode regression
        env:
          AI_VISUAL_FALLBACK_ENABLED: "false"
          AI_MAX_GENERATIONS_PER_VIDEO: "1"
        run: python quality/ai_visual_fallback_regression_test.py
