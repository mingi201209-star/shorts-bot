name: Hook Experiment E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  hook-off-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply production hotfixes
        run: |
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          python ci_rewrite_exhaustion_hotfix.py
          python ci_speech_style_hotfix.py
          grep -n "SCRIPT GENERATION FAILED" main.py
          grep -n "REWRITE EXHAUSTION CANDIDATE REGENERATION" main.py

      - name: Compile and self-test
        run: |
          python -m py_compile \
            main.py \
            ci_rewrite_exhaustion_hotfix.py \
            content/hook_experiment.py \
            content/script_generator/__init__.py \
            video/hook_visual.py \
            video/video_engine.py \
            video/subtitle_engine.py \
            quality/korean_speech_style.py \
            quality/hook_e2e_fixture.py
          PYTHONPATH=. python quality/hook_experiment_test.py
          PYTHONPATH=. python quality/korean_speech_style_test.py

      - name: Run Hook OFF deterministic regression E2E
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ENABLE_HOOK_EXPERIMENT: "0"
          V3_MAX_API_CALLS: "30"
          V3_MAX_COST_USD: "0.03"
        run: |
          set -o pipefail
          PYTHONPATH=. python quality/hook_e2e_fixture.py --mode off 2>&1 | tee hook_off.log

          if grep -q "HOOK FIXTURE CANDIDATES GENERATED" hook_off.log; then
            echo "❌ Hook candidate path occurred while experiment was OFF"
            exit 1
          fi

          if grep -q "HOOK VISUAL AUDIT JSON" hook_off.log; then
            echo "❌ Hook visual path occurred while experiment was OFF"
            exit 1
          fi

          if grep -q "Subtitle safe-area\[HOOK\]" hook_off.log; then
            echo "❌ Hook subtitle path occurred while experiment was OFF"
            exit 1
          fi

          grep -q "FIXTURE E2E COMPLETE | mode=off" hook_off.log

      - name: Probe Hook OFF output
        run: |
          test -s final_shorts.mp4
          test -s hook_off_fixture_result.json
          ffprobe -v error -show_streams -show_format -of json final_shorts.mp4 | tee hook_off_ffprobe.json

          python - <<'PY'
          import json

          data = json.load(open("hook_off_ffprobe.json", encoding="utf-8"))
          streams = data["streams"]
          video = next(stream for stream in streams if stream["codec_type"] == "video")
          audio = next(stream for stream in streams if stream["codec_type"] == "audio")
          assert video["codec_name"] == "h264", video
          assert int(video["width"]) == 1080, video
          assert int(video["height"]) == 1920, video
          rate = video.get("avg_frame_rate") or video.get("r_frame_rate")
          num, den = [int(value) for value in rate.split("/")]
          assert abs(num / den - 30.0) < 0.01, video
          assert audio["codec_name"] == "aac", audio
          fixture = json.load(open("hook_off_fixture_result.json", encoding="utf-8"))
          assert fixture["mode"] == "off", fixture
          assert fixture["selected_hook"] is None, fixture
          assert fixture["production_quality_policy_changed"] is False, fixture
          print("✅ Hook OFF deterministic production-path contract PASS")
          PY

      - name: Upload Hook OFF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-off-regression
          path: |
            final_shorts.mp4
            hook_off.log
            hook_off_ffprobe.json
            hook_off_fixture_result.json

  hook-on-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply production hotfixes
        run: |
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          python ci_rewrite_exhaustion_hotfix.py
          python ci_speech_style_hotfix.py
          grep -n "SCRIPT GENERATION FAILED" main.py
          grep -n "REWRITE EXHAUSTION CANDIDATE REGENERATION" main.py

      - name: Compile and self-test
        run: |
          python -m py_compile \
            main.py \
            ci_rewrite_exhaustion_hotfix.py \
            content/hook_experiment.py \
            content/script_generator/__init__.py \
            video/hook_visual.py \
            video/video_engine.py \
            video/subtitle_engine.py \
            quality/korean_speech_style.py \
            quality/hook_e2e_fixture.py
          PYTHONPATH=. python quality/hook_experiment_test.py
          PYTHONPATH=. python quality/korean_speech_style_test.py

      - name: Run Hook ON deterministic E2E
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ENABLE_HOOK_EXPERIMENT: "1"
          V3_MAX_API_CALLS: "35"
          V3_MAX_COST_USD: "0.04"
        run: |
          set -o pipefail
          PYTHONPATH=. python quality/hook_e2e_fixture.py --mode on 2>&1 | tee hook_on.log

          grep -q "HOOK FIXTURE CANDIDATES GENERATED: 5" hook_on.log
          grep -q "HOOK EXPERIMENT AUDIT JSON" hook_on.log
          grep -q '"candidate_count": 5' hook_on.log
          grep -q "HOOK VISUAL AUDIT JSON" hook_on.log
          grep -q '"mode": "hook_strict"' hook_on.log
          grep -q "Subtitle safe-area\[HOOK\]" hook_on.log
          grep -q "FIXTURE E2E COMPLETE | mode=on" hook_on.log

      - name: Probe Hook ON output and extract first 3 seconds
        run: |
          test -s final_shorts.mp4
          test -s hook_on_fixture_result.json
          ffprobe -v error -show_streams -show_format -of json final_shorts.mp4 | tee hook_on_ffprobe.json

          python - <<'PY'
          import json

          data = json.load(open("hook_on_ffprobe.json", encoding="utf-8"))
          streams = data["streams"]
          video = next(stream for stream in streams if stream["codec_type"] == "video")
          audio = next(stream for stream in streams if stream["codec_type"] == "audio")
          assert video["codec_name"] == "h264", video
          assert int(video["width"]) == 1080, video
          assert int(video["height"]) == 1920, video
          rate = video.get("avg_frame_rate") or video.get("r_frame_rate")
          num, den = [int(value) for value in rate.split("/")]
          assert abs(num / den - 30.0) < 0.01, video
          assert audio["codec_name"] == "aac", audio

          fixture = json.load(open("hook_on_fixture_result.json", encoding="utf-8"))
          assert fixture["mode"] == "on", fixture
          assert fixture["selected_hook"], fixture
          assert fixture["hook_tts_seconds"] <= 3.0, fixture
          assert fixture["production_quality_policy_changed"] is False, fixture
          print(
              "✅ Hook ON codec/resolution/fps/TTS contract PASS | "
              f"hook_tts={fixture['hook_tts_seconds']:.3f}s"
          )
          PY

          ffmpeg -y -i final_shorts.mp4 -t 3 hook_first_3s.mp4
          ffmpeg -y -ss 0.4 -i final_shorts.mp4 -frames:v 1 hook_frame_04.png
          ffmpeg -y -ss 1.4 -i final_shorts.mp4 -frames:v 1 hook_frame_14.png
          ffmpeg -y -ss 2.4 -i final_shorts.mp4 -frames:v 1 hook_frame_24.png

      - name: Upload Hook ON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-on-e2e
          path: |
            final_shorts.mp4
            hook_first_3s.mp4
            hook_frame_04.png
            hook_frame_14.png
            hook_frame_24.png
            hook_on.log
            hook_on_ffprobe.json
            hook_on_fixture_result.json
