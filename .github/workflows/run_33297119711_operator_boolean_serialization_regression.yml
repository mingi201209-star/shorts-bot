name: Run 33297119711 Operator Boolean Serialization Regression

on:
  pull_request:
    paths:
      - '.github/scripts/operator_dispatch_inputs.py'
      - '.github/workflows/shorts_operator_dispatch.yml'
      - '.github/workflows/main.yml'
      - 'quality/run_33297119711_operator_boolean_serialization_regression_test.py'
      - '.github/workflows/run_33297119711_operator_boolean_serialization_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run counterexample regression
        run: python quality/run_33297119711_operator_boolean_serialization_regression_test.py
      - name: Run existing operator dispatch regression
        run: python quality/operator_dispatch_write_regression_test.py
      - name: Run production operator bridge fixed-topic regression
        run: python quality/production_operator_bridge_fixed_topic_regression_test.py
      - name: Run production operator bridge ref regression
        run: python quality/production_operator_bridge_ref_regression_test.py
