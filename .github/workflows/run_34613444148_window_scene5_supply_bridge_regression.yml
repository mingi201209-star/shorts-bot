name: Run 34613444148 Window Scene5 Supply Bridge Regression

on:
  pull_request:
    paths:
      - "quality/candidate_pool_grounding_records.py"
      - "quality/run_34613444148_window_scene5_supply_bridge_regression_test.py"
      - ".github/workflows/run_34613444148_window_scene5_supply_bridge_regression.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run Run 34613444148 Scene 5 supply bridge regression
        run: python quality/run_34613444148_window_scene5_supply_bridge_regression_test.py
