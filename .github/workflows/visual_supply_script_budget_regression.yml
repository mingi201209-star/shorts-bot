name: Visual Supply + Script-Visual Budget V1

on:
  pull_request:
    paths:
      - "content/script_visual_budget.py"
      - "content/script_generator_router.py"
      - "video/still_image_fallback.py"
      - "quality/script_visual_budget_regression_test.py"
      - "quality/visual_supply_regression_test.py"
      - "quality/visual_diversity_preflight.py"
      - "quality/visual_diversity_preflight_regression_test.py"
      - ".github/workflows/visual_supply_script_budget_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run focused regressions
        run: |
          python -m quality.script_visual_budget_regression_test
          python -m quality.visual_supply_regression_test
          python -m quality.visual_diversity_preflight_regression_test

  visual-explanation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python -m py_compile video/visual_explanation.py ci_visual_explanation_retrieval_v1_hotfix.py quality/visual_explanation_retrieval_v1_regression_test.py quality/visual_explanation_retrieval_v1_contract_test.py
          python quality/visual_explanation_retrieval_v1_regression_test.py
          python quality/visual_explanation_retrieval_v1_contract_test.py
          git diff --check

  visual-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m quality.visual_quality_regression_test
      - run: |
          grep -n 'MAX_DIRECTOR_REPAIR_SCENES = 2' quality/final_visual_director.py
          grep -n 'MAX_DIRECTOR_RECOVERY_ROUNDS = 2' quality/final_visual_director.py
          grep -n 'list(candidates or \[\])\[:max_candidates\]' quality/final_visual_director.py
          grep -n 'scene_clips\[repair_index\] = create_scene' ci_visual_quality_v1_hotfix.py

  provider-dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Apply provider production chain
        run: |
          python ci_hotfix.py
          python ci_novelty_budget_hotfix.py
          python ci_fact_critical_hotfix.py
          python ci_speech_style_hotfix.py
          python ci_hook_generation_hotfix.py
          python ci_hook_pool_guard_hotfix.py
          python ci_retention_hotfix.py
          python ci_first5_retention_tts_hotfix.py
          python ci_first5_visual_contract_hotfix.py
          python ci_video_provider_hotfix.py
          python ci_cross_process_video_dedupe_hotfix.py
          python ci_topic_input_hotfix.py
      - run: |
          python quality/video_provider_pool_regression_test.py
          python quality/cross_process_video_dedupe_regression_test.py

  general-visual-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          AI_VISUAL_FALLBACK_ENABLED: "false"
          AI_MAX_GENERATIONS_PER_VIDEO: "1"
        run: python quality/general_scene_visual_parity_regression_test.py

  output-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python quality/output_quality_regression_test.py
