name: Hook Production Parity Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "ci_hook_production_parity_hotfix.py"
      - "quality/hook_production_parity_regression_test.py"
      - ".github/workflows/main.yml"
      - ".github/workflows/hook_production_parity_regression.yml"

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run Hook production parity focused regression
        run: python quality/hook_production_parity_regression_test.py
