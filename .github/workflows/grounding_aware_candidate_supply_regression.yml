name: Grounding-Aware Candidate Supply Regression

on:
  push:
    branches:
      - "fix/run-33960845940-grounding-aware-supply"
    paths:
      - "quality/grounding_aware_candidate_supply.py"
      - "quality/grounding_aware_candidate_supply_regression_test.py"
      - "ci_grounding_aware_candidate_supply_hotfix.py"
      - "ci_aviation_specificity_projection_hotfix.py"
      - ".github/workflows/grounding_aware_candidate_supply_regression.yml"
  pull_request:
    branches:
      - main
    paths:
      - "quality/grounding_aware_candidate_supply.py"
      - "quality/grounding_aware_candidate_supply_regression_test.py"
      - "ci_grounding_aware_candidate_supply_hotfix.py"
      - "ci_aviation_specificity_projection_hotfix.py"
      - ".github/workflows/grounding_aware_candidate_supply_regression.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  grounding-aware-supply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply Candidate Explorer production prerequisites
        run: |
          set -euo pipefail
          python ci_hotfix.py
          python ci_topic_input_hotfix.py
          python ci_aviation_candidate_context_hotfix.py
          python ci_aviation_candidate_specificity_hotfix.py
          python ci_aviation_context_signature_compat_hotfix.py
          python ci_aviation_specificity_output_repair_hotfix.py
          python ci_aviation_specificity_projection_hotfix.py
          python ci_candidate_grounded_recovery_hotfix.py
      - name: Compile grounding-aware supply surface
        run: |
          python -m py_compile \
            quality/grounding_aware_candidate_supply.py \
            quality/grounding_aware_candidate_supply_regression_test.py \
            ci_grounding_aware_candidate_supply_hotfix.py \
            ci_candidate_pool_handoff_hotfix.py \
            ci_aviation_specificity_projection_hotfix.py \
            content/candidate_explorer.py
      - name: Run Run 33960845940 regression
        env:
          SHORTS_CANDIDATE_SCOPE: aviation
        run: python quality/grounding_aware_candidate_supply_regression_test.py
      - name: Verify safety invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/main.yml').read_text(encoding='utf-8')
          main = Path('main.py').read_text(encoding='utf-8')
          recovery = Path('ci_candidate_supply_recovery_hotfix.py').read_text(encoding='utf-8')
          assert 'V3_MAX_API_CALLS: "60"' in workflow
          assert 'V3_MAX_COST_USD: "0.05"' in workflow
          assert 'MAX_TOPIC_REGENERATIONS = 6' in main
          assert 'CANDIDATE SUPPLY RECOVERY (1/1)' in recovery
          print('THRESHOLDS_CHANGED=NO')
          print('API_CAP_CHANGED=NO')
          print('COST_CAP_CHANGED=NO')
          print('RETRY_CHANGED=NO')
          print('NEW_LLM_CALLS=0')
          print('NEW_VISION_CALLS=0')
          print('NEW_IMAGE_GENERATION_CALLS=0')
          PY
