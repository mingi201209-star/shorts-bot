name: Script Final Normalization Composition Regression

on:
  pull_request:
    paths:
      - "ci_script_validation_recovery_hotfix.py"
      - "ci_script_v2_gunggeum_formal_ending_hotfix.py"
      - "content/script_generator.py"
      - "quality/korean_speech_style.py"
      - "quality/script_final_normalization_composition_regression_test.py"
      - ".github/workflows/script_final_normalization_composition_regression.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run production-composition regression
        run: python quality/script_final_normalization_composition_regression_test.py
