name: Run 34685288234 Fixed Topic Gate Feedback Shadow Regression

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "content/candidate_explorer/__init__.py"
      - "quality/run_34685288234_fixed_topic_gate_feedback_shadow_regression_test.py"
      - ".github/workflows/run_34685288234_fixed_topic_gate_feedback_shadow_regression.yml"
  pull_request:
    branches:
      - main
    paths:
      - "content/candidate_explorer/__init__.py"
      - "quality/run_34685288234_fixed_topic_gate_feedback_shadow_regression_test.py"
      - ".github/workflows/run_34685288234_fixed_topic_gate_feedback_shadow_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile fix and regression
        run: |
          python -m py_compile \
            content/candidate_explorer/__init__.py \
            quality/run_34685288234_fixed_topic_gate_feedback_shadow_regression_test.py
      - name: Run Run 526/527 fixed-topic gate feedback shadow regression
        run: python quality/run_34685288234_fixed_topic_gate_feedback_shadow_regression_test.py
