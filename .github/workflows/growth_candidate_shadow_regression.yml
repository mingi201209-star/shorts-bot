name: Growth Candidate Shadow Regression

on:
  pull_request:
    paths:
      - "content/growth_candidate_ranker.py"
      - "analytics/**"
      - "ci_growth_candidate_shadow_hotfix.py"
      - "quality/growth_candidate_shadow_*"
      - ".github/workflows/growth_candidate_shadow_regression.yml"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run growth-aware candidate shadow regressions
        run: |
          python -m quality.growth_candidate_shadow_regression_test
          python -m quality.growth_candidate_shadow_production_regression_test
