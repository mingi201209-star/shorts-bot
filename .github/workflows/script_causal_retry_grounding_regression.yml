name: Script Causal Retry Grounding Regression

on:
  pull_request:
    paths:
      - 'ci_script_validation_recovery_hotfix.py'
      - 'quality/script_causal_retry_grounding_regression_test.py'
      - '.github/workflows/script_causal_retry_grounding_regression.yml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused regression
        run: python quality/script_causal_retry_grounding_regression_test.py
