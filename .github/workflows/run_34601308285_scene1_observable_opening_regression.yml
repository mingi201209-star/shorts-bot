name: Run 34601308285 Scene1 Observable Opening Regression

on:
  pull_request:
    paths:
      - 'ci_script_v2_gunggeum_formal_ending_hotfix.py'
      - 'quality/run_34601308285_scene1_observable_opening_regression_test.py'
      - 'content/script_engine_v2.py'
      - '.github/workflows/run_34601308285_scene1_observable_opening_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic Scene 1 observable-opening regression
        run: python quality/run_34601308285_scene1_observable_opening_regression_test.py
