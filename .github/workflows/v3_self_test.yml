name: V3 Self Test

on:
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found"
            exit 1
          fi

      - name: Compile V3 pipeline files
        run: |
          python -m py_compile main.py
          python -m py_compile content/candidate_gate.py
          python -m py_compile content/candidate_explorer.py
          python -m py_compile content/script_generator.py
          python -m py_compile quality/rewrite_engine.py
          python -m py_compile quality/judge.py
          python -m py_compile quality/consensus.py
          python -m py_compile quality/review_router.py

      - name: Run V3 quality self test
        run: |
          python -m quality.self_test
